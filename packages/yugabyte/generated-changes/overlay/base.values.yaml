# Use new naming style to generate app.kubernetes.io/name labels (required by kyverno)
oldNamingStyle: false

# Add required labels that all resources need
commonLabels:
  app.kubernetes.io/managed-by: "helm"
  metadata.example.com/team: "platform"

# Add required annotations to StatefulSets
statefulSetAnnotations:
  metadata.example.com/repository: "https://github.com/therealgambo/k8s-charts"

# Pod security hardening - enable podSecurityContext
podSecurityContext:
  enabled: true
  runAsNonRoot: true
  fsGroup: 10001
  runAsUser: 10001
  runAsGroup: 10001
