# Use new naming style to generate app.kubernetes.io/name labels (required by kyverno)
oldNamingStyle: false

# Add required labels that all resources need
commonLabels:
  app.kubernetes.io/managed-by: "helm"
  metadata.example.com/team: "platform"

# Add required annotations to StatefulSets
statefulSetAnnotations:
  metadata.example.com/repository: "https://github.com/therealgambo/k8s-charts"

# Add required annotations to Services. NOTE: serviceEndpoints is a list, and Helm's values
# merge replaces lists wholesale rather than merging by key -- so every field from the upstream
# values.yaml entry (type, scope, ports, etc.) must be repeated here, not just the new annotation.
serviceEndpoints:
  - name: "yb-master-ui"
    type: LoadBalancer
    scope: "AZ"
    annotations:
      metadata.example.com/repository: "https://github.com/therealgambo/k8s-charts"
    clusterIP: ""
    externalTrafficPolicy: ""
    app: "yb-master"
    loadBalancerIP: ""
    ports:
      http-ui: "7000"

  - name: "yb-tserver-service"
    type: LoadBalancer
    scope: "AZ"
    annotations:
      metadata.example.com/repository: "https://github.com/therealgambo/k8s-charts"
    clusterIP: ""
    externalTrafficPolicy: ""
    app: "yb-tserver"
    loadBalancerIP: ""
    ports:
      tcp-yql-port: "9042"
      tcp-yedis-port: "6379"
      tcp-ysql-port: "5433"

  - name: "yugabyted-ui-service"
    type: LoadBalancer
    scope: "AZ"
    annotations:
      metadata.example.com/repository: "https://github.com/therealgambo/k8s-charts"
    clusterIP: ""
    externalTrafficPolicy: ""
    app: "yb-master"
    loadBalancerIP: ""
    sessionAffinity: ClientIP
    ports:
      yugabyted-ui: "15433"

# tserver is a map in upstream values.yaml, so this deep-merges in alongside its other keys
# (unlike serviceEndpoints above, which is a list).
tserver:
  tmpVolume:
    sizeLimit: 1Gi

# yugabytedUi is a map in upstream values.yaml -- deep-merges alongside its other keys.
# There's no resources knob for the yugabyted-ui sidecar upstream at all (see the
# service.yaml.patch that adds the wiring), so this is a genuinely new value, not an override
# of an existing default.
yugabytedUi:
  resources:
    requests:
      cpu: "100m"
      memory: 128Mi
    limits:
      cpu: "200m"
      memory: 256Mi

# ybCleanup.resources is already wired straight through to the yb-cleanup sidecar's
# `resources:` field by the upstream template, but defaults to {} (unset) -- give it a real
# default so require-resource-requests-limits passes for that container too.
ybCleanup:
  resources:
    requests:
      cpu: "100m"
      memory: 128Mi
    limits:
      cpu: "200m"
      memory: 256Mi

# Pod security hardening - enable podSecurityContext
podSecurityContext:
  enabled: true
  runAsNonRoot: true
  fsGroup: 10001
  runAsUser: 10001
  runAsGroup: 10001

# Container-level securityContext, applied to every container in the chart (main yb-master/
# yb-tserver, yb-cleanup, yugabyted-ui, yb-controller, certmanager-init) via the
# service.yaml.patch wiring -- no upstream equivalent existed, this is a genuinely new value.
# readOnlyRootFilesystem is deliberately omitted: yugabyted writes scripts/logs under its own
# working dir at runtime and isn't validated against a read-only root here.
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

