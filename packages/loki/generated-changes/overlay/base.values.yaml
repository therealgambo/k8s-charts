# Kyverno policy compliance overrides for loki

# Add required resource labels
commonLabels:
  app.kubernetes.io/managed-by: Helm
  metadata.example.com/team: platform

# Global defaults
defaults:
  # Service annotations
  service:
    annotations:
      metadata.example.com/repository: https://github.com/therealgambo/k8s-charts
  # Workload resource annotations
  annotations:
    metadata.example.com/repository: https://github.com/therealgambo/k8s-charts

# ServiceAccount configuration
serviceAccount:
  # ServiceAccount annotations
  annotations:
    metadata.example.com/repository: https://github.com/therealgambo/k8s-charts

# Global loki configuration annotations
loki:
  serviceAnnotations:
    metadata.example.com/repository: https://github.com/therealgambo/k8s-charts

# Gateway configuration
gateway:
  # Annotation for resource-level metadata
  annotations:
    metadata.example.com/repository: https://github.com/therealgambo/k8s-charts
  # Resource requests and limits
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  # Metrics exporter resources
  metrics:
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi
  # Pod-level annotation
  podAnnotations:
    metadata.example.com/repository: https://github.com/therealgambo/k8s-charts
  # ServiceAccount annotations
  serviceAccount:
    annotations:
      metadata.example.com/repository: https://github.com/therealgambo/k8s-charts

# Canary configuration
lokiCanary:
  # Annotation for resource-level metadata
  annotations:
    metadata.example.com/repository: https://github.com/therealgambo/k8s-charts
  # Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # Pod-level annotation
  podAnnotations:
    metadata.example.com/repository: https://github.com/therealgambo/k8s-charts
  # Service annotations
  service:
    annotations:
      metadata.example.com/repository: https://github.com/therealgambo/k8s-charts
  # ServiceAccount annotations
  serviceAccount:
    annotations:
      metadata.example.com/repository: https://github.com/therealgambo/k8s-charts

# Sidecar configuration (k8s-sidecar for rules)
sidecar:
  # Resource requests and limits for the sidecar
  resources:
    requests:
      cpu: 50m
      memory: 50Mi
    limits:
      cpu: 100m
      memory: 100Mi
  # Rules volume configuration
  rules:
    # Size limit for the rules emptyDir volume
    sizeLimit: 256Mi

# Memcached Exporter configuration
memcachedExporter:
  # Resource requests and limits for the memcached exporter
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

# Memcached configuration
memcached:
  # ServiceAccount annotations
  serviceAccount:
    annotations:
      metadata.example.com/repository: https://github.com/therealgambo/k8s-charts
    # Explicit automount token setting
    automountServiceAccountToken: false

# Chunks cache configuration
chunksCache:
  # Explicit automount token setting
  automountServiceAccountToken: false
  # Annotation for resource-level metadata
  annotations:
    metadata.example.com/repository: https://github.com/therealgambo/k8s-charts
  # Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: 500m
      memory: 2Gi
  # Pod-level annotation
  podAnnotations:
    metadata.example.com/repository: https://github.com/therealgambo/k8s-charts
  # Service annotations
  service:
    annotations:
      metadata.example.com/repository: https://github.com/therealgambo/k8s-charts

# Results cache configuration
resultsCache:
  # Explicit automount token setting
  automountServiceAccountToken: false
  # Annotation for resource-level metadata
  annotations:
    metadata.example.com/repository: https://github.com/therealgambo/k8s-charts
  # Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 512Mi
  # Pod-level annotation
  podAnnotations:
    metadata.example.com/repository: https://github.com/therealgambo/k8s-charts
  # Service annotations
  service:
    annotations:
      metadata.example.com/repository: https://github.com/therealgambo/k8s-charts

# Main loki workload configuration (Monolithic mode)
singleBinary:
  # Annotation for resource-level metadata
  annotations:
    metadata.example.com/repository: https://github.com/therealgambo/k8s-charts
  # Resource requests and limits
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # Pod-level annotation
  podAnnotations:
    metadata.example.com/repository: https://github.com/therealgambo/k8s-charts
  # ServiceAccount annotations
  serviceAccount:
    annotations:
      metadata.example.com/repository: https://github.com/therealgambo/k8s-charts
