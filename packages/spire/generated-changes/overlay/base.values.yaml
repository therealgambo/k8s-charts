global:
  spire:
    namespaces:
      create: true
      system:
        labels:
          pager.example.com/key: "system"
          app.kubernetes.io/name: spire-system
          app.kubernetes.io/managed-by: helm
          metadata.example.com/team: spire
        annotations:
          metadata.example.com/repository: "https://github.com/therealgambo/k8s-charts"
      server:
        labels:
          pager.example.com/key: "server"
          app.kubernetes.io/name: spire-server
          app.kubernetes.io/managed-by: helm
          metadata.example.com/team: spire
        annotations:
          metadata.example.com/repository: "https://github.com/therealgambo/k8s-charts"
  # kyverno-pod-policies' require-resource-requests-limits requires every container to carry
  # requests+limits -- these two hooks' Job containers (see spire-server's post-install/post-
  # upgrade/pre-upgrade-hook.yaml and spiffe-oidc-discovery-provider's pre-delete-hook.yaml) only
  # render a resources block when this is set (it's a bare `{{- with ... }}`, no default).
  installAndUpgradeHooks:
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  deleteHooks:
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

# Every subchart below defaults resources: {} -- kyverno-pod-policies' require-resource-
# requests-limits requires every container to carry both requests and limits, so each needs a
# real value here. Sized conservatively; adjust per-cluster as observed usage dictates.
spire-server:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # The chown init container (see server-resource.yaml's $needsChown) and the optional
  # spire-controller-manager sidecar (controllerManager.enabled: true by default -- see this
  # umbrella chart's own values.yaml) are separate containers with their own resources key.
  chown:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 32Mi
  controllerManager:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  # Wired into templates/tests/test-*.yaml's containers -- see the kyverno-policy-fix skill's
  # step 2 "Helm test hooks often build their own bare metadata block" for why these needed a
  # values knob added rather than already having one.
  tests:
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

spire-agent:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

spiffe-csi-driver:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

spiffe-oidc-discovery-provider:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # The spiffe-helper init+sidecar containers (tls.spire.enabled: true by default) have their own
  # resources key, same reasoning as spire-server.controllerManager above.
  spiffeHelper:
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  tests:
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
