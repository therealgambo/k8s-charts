# Local addition (not part of upstream): Gateway API resources for this chart's traffic flows,
# targeting Cilium's Gateway API implementation (gatewayClassName "cilium", requires the cilium
# chart's gatewayAPI.enabled=true and the gateway-api-crd package installed). Istio-specific
# concerns (mTLS/authn/authz -- Sidecar, AuthorizationPolicy, DestinationRule, ServiceEntry,
# VirtualService, elsewhere in this chart) are out of scope here; this file only wires up routing.
#
# Two halves:
#   - North-south: a Gateway + HTTPRoute exposing the frontend, alongside (not replacing) the
#     existing frontend-external LoadBalancer Service and Istio VirtualService.
#   - East-west (GAMMA): an HTTPRoute/GRPCRoute/TCPRoute per backend Service, with parentRefs
#     pointing at the Service itself (kind: Service) instead of a Gateway. Cilium intercepts
#     traffic addressed to the Service's ClusterIP and applies these rules. Each is a plain
#     passthrough today -- no retries/timeouts/splits configured -- since there's no existing
#     traffic-shaping to port over. The point is to have explicit, mesh-portable routing objects
#     in place of the current implicit "just hit the ClusterIP" behavior, so real rules can be
#     layered on top later.
{{- if .Values.gatewayAPI.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: onlineboutique-gateway
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: cilium
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
{{- if .Values.frontend.create }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.frontend.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.frontend.name }}
spec:
  parentRefs:
  - name: onlineboutique-gateway
  rules:
  - backendRefs:
    - name: {{ .Values.frontend.name }}
      port: 80
{{- end }}

{{- if .Values.adService.create }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: {{ .Values.adService.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.adService.name }}
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: {{ .Values.adService.name }}
  rules:
  - backendRefs:
    - name: {{ .Values.adService.name }}
      port: 9555
{{- end }}

