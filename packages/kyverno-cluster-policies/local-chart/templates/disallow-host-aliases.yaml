{{/*
DNS hygiene: no `hostAliases` entries -- lets a Pod locally override hostname resolution for
specific names, effectively a pod-local MITM/DNS-spoof of anything it talks to by name. Enforce by
default (chart-wide policy, see README) even though some legitimate uses exist (local overrides
during a migration) -- set policies.disallow-host-aliases.validationFailureAction to `Audit`
per-cluster if that applies to you. No direct kyverno/policies CEL equivalent found -- derived
directly from the Pod spec schema; null-coalesced per the documented CEL gotcha (see README) since
hostAliases is a list-typed optional field.
*/}}
{{- $id := "disallow-host-aliases" }}
{{- if ne .Values.enabled false }}
{{- if eq (include "kyverno-cluster-policies.policyEnabled" (dict "id" $id "root" $)) "true" }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $id }}
  labels:
    {{- include "kyverno-cluster-policies.labels" $ | nindent 4 }}
    {{- with .Values.commonLabels }}{{- toYaml . | nindent 4 }}{{- end }}
  annotations:
    policies.kyverno.io/title: Disallow Host Aliases
    policies.kyverno.io/category: DNS Hygiene
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Blocks any `hostAliases` entry -- lets a Pod locally override hostname resolution for
      specific names, effectively a pod-local MITM/DNS-spoof of anything it talks to by name.
    {{- with .Values.commonAnnotations }}{{- toYaml . | nindent 4 }}{{- end }}
spec:
  background: {{ .Values.background | default true }}
  rules:
    - name: disallow-host-aliases
      match:
        any:
          - resources: { kinds: [Pod], operations: [CREATE, UPDATE] }
      exclude:
        {{- include "kyverno-cluster-policies.exclude" (dict "id" $id "root" $) | nindent 8 }}
      validate:
        failureAction: {{ include "kyverno-cluster-policies.failureAction" (dict "id" $id "tierDefault" "Enforce" "root" $) }}
        cel:
          variables:
            - name: hostAliases
              expression: "object.spec.?hostAliases.orValue([])"
          expressions:
            - expression: "(variables.hostAliases == null ? [] : variables.hostAliases).size() == 0"
              message: "Setting hostAliases is not allowed."
{{- end }}
{{- end }}
