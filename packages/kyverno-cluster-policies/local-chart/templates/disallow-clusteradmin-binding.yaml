{{/*
RBAC privilege-escalation prevention: blocks binding the cluster-admin ClusterRole to the
`default` ServiceAccount specifically -- narrower than kyverno/policies other-cel/
restrict-binding-clusteradmin (which blocks ALL cluster-admin bindings and ships Audit-tier,
because plenty of clusters have a legitimate human break-glass binding). Binding cluster-admin to
a namespace's `default` SA is never legitimate -- any pod that forgets to set serviceAccountName
inherits it -- so this narrower check is safe to default Enforce. A cluster wanting the broader
upstream check too can add it as its own policy; not duplicated here.
https://github.com/kyverno/policies/blob/main/other-cel/restrict-binding-clusteradmin/restrict-binding-clusteradmin.yaml
*/}}
{{- $id := "disallow-clusteradmin-binding" }}
{{- if ne .Values.enabled false }}
{{- if eq (include "kyverno-cluster-policies.policyEnabled" (dict "id" $id "root" $)) "true" }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $id }}
  labels:
    {{- include "kyverno-cluster-policies.labels" $ | nindent 4 }}
    {{- with .Values.commonLabels }}{{- toYaml . | nindent 4 }}{{- end }}
  annotations:
    policies.kyverno.io/title: Disallow cluster-admin Binding to the default ServiceAccount
    policies.kyverno.io/category: RBAC Privilege Escalation
    policies.kyverno.io/subject: RoleBinding, ClusterRoleBinding, RBAC
    policies.kyverno.io/description: >-
      Blocks binding the cluster-admin ClusterRole to a namespace's `default` ServiceAccount --
      never legitimate, since any Pod that forgets to set serviceAccountName inherits it.
    {{- with .Values.commonAnnotations }}{{- toYaml . | nindent 4 }}{{- end }}
spec:
  background: {{ .Values.background | default true }}
  rules:
    - name: clusteradmin-default-sa-binding
      match:
        any:
          - resources: { kinds: [RoleBinding, ClusterRoleBinding], operations: [CREATE, UPDATE] }
      exclude:
        {{- include "kyverno-cluster-policies.exclude" (dict "id" $id "root" $) | nindent 8 }}
      validate:
        failureAction: {{ include "kyverno-cluster-policies.failureAction" (dict "id" $id "tierDefault" "Enforce" "root" $) }}
        cel:
          variables:
            - name: subjects
              expression: "object.?subjects.orValue([])"
          expressions:
            - expression: >-
                object.roleRef.name != 'cluster-admin' ||
                !(variables.subjects == null ? [] : variables.subjects).exists(s,
                  s.kind == 'ServiceAccount' && s.name == 'default')
              message: "Binding cluster-admin to the default ServiceAccount is not allowed."
{{- end }}
{{- end }}
