{{/*
Resource/DoS protection: every container must set cpu/memory requests and a memory limit -- an
unbounded container is a noisy-neighbor/cost-control risk. Verbatim logic from kyverno/policies
best-practices-cel/require-pod-requests-limits (containers is a required Pod spec field, no
null-handling concern).
https://github.com/kyverno/policies/blob/main/best-practices-cel/require-pod-requests-limits/require-pod-requests-limits.yaml
*/}}
{{- $id := "require-resource-requests-limits" }}
{{- if ne .Values.enabled false }}
{{- if eq (include "kyverno-cluster-policies.policyEnabled" (dict "id" $id "root" $)) "true" }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $id }}
  labels:
    {{- include "kyverno-cluster-policies.labels" $ | nindent 4 }}
    {{- with .Values.commonLabels }}{{- toYaml . | nindent 4 }}{{- end }}
  annotations:
    policies.kyverno.io/title: Require Resource Requests and Limits
    policies.kyverno.io/category: Resource and DoS Protection
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Every container must specify cpu/memory requests and a memory limit -- an unbounded
      container is a noisy-neighbor/cost-control risk.
    {{- with .Values.commonAnnotations }}{{- toYaml . | nindent 4 }}{{- end }}
spec:
  background: {{ .Values.background | default true }}
  rules:
    - name: validate-resources
      match:
        any:
          - resources: { kinds: [Pod], operations: [CREATE, UPDATE] }
      exclude:
        {{- include "kyverno-cluster-policies.exclude" (dict "id" $id "root" $) | nindent 8 }}
      validate:
        failureAction: {{ include "kyverno-cluster-policies.failureAction" (dict "id" $id "tierDefault" "Enforce" "root" $) }}
        cel:
          expressions:
            - expression: >-
                object.spec.containers.all(container,
                  has(container.resources) &&
                  has(container.resources.requests) &&
                  has(container.resources.requests.memory) &&
                  has(container.resources.requests.cpu) &&
                  has(container.resources.limits) &&
                  has(container.resources.limits.memory))
              message: "CPU and memory resource requests and limits are required."
{{- end }}
{{- end }}
