{{/*
Supply chain: every container/initContainer/ephemeralContainer image must start with one of
config.allowedRegistries. Skipped entirely (celPreconditions) when that list is empty, rather than
flagging every single Pod -- an unpopulated allow-list means "not opted in yet", not "block
everything". Adapted from kyverno/policies best-practices-cel/restrict-image-registries, templated
to a configurable prefix list; the null-coalesce on init/ephemeral containers guards the documented
"present-but-null field breaks .orValue()" CEL gotcha (see README).
https://github.com/kyverno/policies/blob/main/best-practices-cel/restrict-image-registries/restrict-image-registries.yaml
*/}}
{{- $id := "restrict-image-registries" }}
{{- if ne .Values.enabled false }}
{{- if eq (include "kyverno-cluster-policies.policyEnabled" (dict "id" $id "root" $)) "true" }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $id }}
  labels:
    {{- include "kyverno-cluster-policies.labels" $ | nindent 4 }}
    {{- with .Values.commonLabels }}{{- toYaml . | nindent 4 }}{{- end }}
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Images from unknown, public registries can be of dubious quality and may not be scanned and
      secured. This policy validates that container images only originate from a registry prefix
      listed in config.allowedRegistries. No-op until that list is populated.
    {{- with .Values.commonAnnotations }}{{- toYaml . | nindent 4 }}{{- end }}
spec:
  background: {{ .Values.background | default true }}
  rules:
    - name: validate-registries
      match:
        any:
          - resources: { kinds: [Pod], operations: [CREATE, UPDATE] }
      exclude:
        {{- include "kyverno-cluster-policies.exclude" (dict "id" $id "root" $) | nindent 8 }}
      celPreconditions:
        - name: has-allowed-registries
          expression: {{ printf "%s.size() > 0" (.Values.config.allowedRegistries | default list | toJson) | quote }}
      validate:
        failureAction: {{ include "kyverno-cluster-policies.failureAction" (dict "id" $id "tierDefault" "Audit" "root" $) }}
        cel:
          variables:
            - name: allowedRegistries
              expression: {{ .Values.config.allowedRegistries | default list | toJson | quote }}
            - name: initContainers
              expression: "object.spec.?initContainers.orValue([])"
            - name: ephemeralContainers
              expression: "object.spec.?ephemeralContainers.orValue([])"
            - name: allContainers
              expression: >-
                object.spec.containers +
                (variables.initContainers == null ? [] : variables.initContainers) +
                (variables.ephemeralContainers == null ? [] : variables.ephemeralContainers)
          expressions:
            - expression: >-
                variables.allContainers.all(container,
                  variables.allowedRegistries.exists(r, container.image.startsWith(r)))
              message: >-
                Image registry not in the allowed list. See config.allowedRegistries.
{{- end }}
{{- end }}
