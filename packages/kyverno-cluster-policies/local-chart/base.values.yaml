# Local overrides on top of values.yaml -- see ../../../README.md#values-file-ordering, and the
# comment above `exceptions:` in values.yaml for why real, live exceptions live here rather than
# in that file's shipped default.

exceptions:
  # packages/cilium's agent/envoy DaemonSets and operator Deployment ship
  # system-node-critical/system-cluster-critical priorityClassName by upstream default -- Cilium
  # is the cluster's CNI, so losing it to node-pressure eviction takes pod networking down
  # cluster-wide, not just one workload. That's a real "node-critical system workload", not an
  # unreviewed default. Scoped by namespace + label + name -- `make template` always renders a
  # package into --namespace <package name> (see Makefile), so cilium's own package name is a
  # reliable namespace filter here, not just a label/name belt-and-suspenders.
  cilium:
    policies: [restrict-priorityclass]
    match:
      kinds: [DaemonSet, Deployment]
      namespaces: [cilium]
      names: [cilium, cilium-envoy, cilium-operator]
      selector:
        matchLabels:
          app.kubernetes.io/part-of: cilium

  # packages/aws-ebs-csi-driver's controller Deployment and both node DaemonSets ship
  # system-cluster-critical/system-node-critical priorityClassName by upstream default -- a CSI
  # controller/node plugin losing to node-pressure eviction takes volume mounts down with it, so
  # this is a real "node-critical system workload", not an unreviewed default. Scoped by
  # namespace + label + name -- `make template` always renders a package into --namespace
  # <package name> (see Makefile), so aws-ebs-csi-driver's own package name is a reliable
  # namespace filter here, not just a label/name belt-and-suspenders.
  aws-ebs-csi-driver:
    policies: [restrict-priorityclass]
    match:
      kinds: [Deployment, DaemonSet]
      namespaces: [aws-ebs-csi-driver]
      names: [ebs-csi-controller, ebs-csi-node, ebs-csi-node-windows]
      selector:
        matchLabels:
          app.kubernetes.io/name: aws-ebs-csi-driver

  # packages/argo-cd's application-controller ClusterRole ships wildcard apiGroups/resources/verbs
  # by upstream default -- Argo CD's application controller is a generic GitOps reconciler that
  # has to be able to sync arbitrary Kubernetes resource types users declare in their
  # Applications, so it genuinely needs cluster-wide access to any kind, not just a fixed set --
  # narrowing the rule would break syncing anything outside that fixed set, not just silence the
  # check. That verb wildcard is what disallow-rbac-escalation-verbs' `escalate` rule also flags
  # (verbs: ['*'] implicitly includes bind/escalate/impersonate). Scoped to kinds: [ClusterRole]
  # since the default `exceptions:` kind list targets Pod-controller kinds, this policy targets
  # Role/ClusterRole -- and to ClusterRole specifically (not Role) since that's the kind these two
  # resources actually are. Deliberately NO `namespaces:` filter -- ClusterRole is cluster-scoped
  # (no namespace of its own), and confirmed empirically that adding one here makes the exception
  # never match at all (kyverno apply kept reporting the same failures) rather than being a no-op;
  # name + selector carry the scoping instead.
  argo-cd-application-controller:
    policies: [disallow-wildcard-rbac, disallow-rbac-escalation-verbs]
    match:
      kinds: [ClusterRole]
      names: [release-name-argocd-application-controller]
      selector:
        matchLabels:
          app.kubernetes.io/part-of: argocd

  # packages/argo-cd's server ClusterRole ships wildcard apiGroups/resources by upstream default
  # -- the UI's live-resource-view/delete/patch features need to operate on any Kubernetes
  # resource kind a user's Applications might contain, same "generic GitOps tool" reasoning as
  # application-controller above. Only disallow-wildcard-rbac applies here: unlike
  # application-controller, this ClusterRole's verbs are a fixed list (delete/get/patch, plus a
  # few narrowly-scoped rules below it), never '*', so disallow-rbac-escalation-verbs' `escalate`
  # rule doesn't fire on it and isn't exempted. No `namespaces:` filter, same reason as
  # application-controller above.
  argo-cd-server:
    policies: [disallow-wildcard-rbac]
    match:
      kinds: [ClusterRole]
      names: [release-name-argocd-server]
      selector:
        matchLabels:
          app.kubernetes.io/part-of: argocd

  # packages/kargo dynamically provisions per-Project RBAC: as each Kargo Project namespace is
  # created, the API server/webhooks-server/management-controller bind their most sensitive
  # permissions (on Secrets/ConfigMaps/ServiceAccounts, and on Roles/RoleBindings themselves) into
  # that namespace via these cluster-scoped ClusterRoles, rather than granting them cluster-wide up
  # front -- that's the whole point of the design (see the chart's own comments in
  # templates/common/cluster-roles.yaml). Narrowing the wildcard verbs would break Kargo's ability
  # to grant/revoke per-Project access at all, not just silence the check -- same "generic
  # tool needs broad verbs on its own management surface" reasoning as argo-cd-application-
  # controller above. kargo-project-admin/kargo-webhooks-server/kargo-management-controller also
  # hold wildcard verbs on Roles/RoleBindings/ClusterRoles/ClusterRoleBindings under
  # rbac.authorization.k8s.io, which is exactly what disallow-rbac-escalation-verbs' `escalate`
  # rule flags too -- kargo-api/kargo-admin don't (their rbac.authorization.k8s.io rules are
  # get/list/watch only), so those two are deliberately left off that policy's list. No
  # `namespaces:` filter -- ClusterRole is cluster-scoped, and (per the argo-cd-application-
  # controller comment above) adding one here makes the exception never match at all.
  kargo-clusterroles-escalate:
    policies: [disallow-wildcard-rbac, disallow-rbac-escalation-verbs]
    match:
      kinds: [ClusterRole]
      names: [kargo-project-admin, kargo-webhooks-server, kargo-management-controller]
      selector:
        matchLabels:
          app.kubernetes.io/name: kargo

  kargo-clusterroles-wildcard-only:
    policies: [disallow-wildcard-rbac]
    match:
      kinds: [ClusterRole]
      names: [kargo-api, kargo-admin]
      selector:
        matchLabels:
          app.kubernetes.io/name: kargo

  # Same dynamic per-Project RBAC design as the ClusterRoles above, but these are the namespaced
  # Role counterparts: kargo-admin/kargo-api (release namespace) hold wildcard verbs on Secrets
  # (kargo-api only when api.secretManagementEnabled), and kargo-cluster-secrets-admin/
  # kargo-shared-resources-admin/kargo-system-resources-admin (their own dedicated namespaces) hold
  # wildcard verbs on Secrets/ConfigMaps for the same reason -- Kargo's own admin-facing roles need
  # full CRUD on the resources they administer. None of these carry wildcard verbs on
  # rbac.authorization.k8s.io resources, so disallow-rbac-escalation-verbs' `escalate` rule doesn't
  # fire on them and isn't exempted here. Namespaces listed explicitly (Role is namespaced, unlike
  # ClusterRole above) -- `make template` always renders packages/kargo into --namespace kargo (see
  # Makefile), and the other three are this chart's own extra namespaces
  # (global.systemResources.namespace/global.sharedResources.namespace/
  # global.clusterSecretsNamespace), all of which default to the kargo-<name> values seen here.
  kargo-roles-wildcard:
    policies: [disallow-wildcard-rbac]
    match:
      kinds: [Role]
      namespaces: [kargo, kargo-cluster-secrets, kargo-shared-resources, kargo-system-resources]
      names: [kargo-admin, kargo-api, kargo-cluster-secrets-admin, kargo-shared-resources-admin, kargo-system-resources-admin]
      selector:
        matchLabels:
          app.kubernetes.io/name: kargo

  # packages/karpenter's controller Deployment ships system-cluster-critical priorityClassName
  # by upstream default -- Karpenter is a cluster autoscaler whose eviction would prevent new pod
  # scheduling during node-pressure conditions, making it a real "node-critical system workload",
  # not an unreviewed default. Scoped by namespace + label + name -- `make template` always
  # renders a package into --namespace <package name> (see Makefile), so karpenter's own package
  # name is a reliable namespace filter here, not just a label/name belt-and-suspenders.
  karpenter:
    policies: [restrict-priorityclass]
    match:
      kinds: [Deployment]
      namespaces: [karpenter]
      names: [karpenter]
      selector:
        matchLabels:
          app.kubernetes.io/name: karpenter

  # packages/mimir-distributed's bundled `minio` dependency (used only when minio.enabled -- a
  # dev/test object-store backend, not what production Mimir deployments point at) is a vendored
  # subchart with no label/annotation/automount/resources override knob at all: no shared labels
  # helper (every template hardcodes its own metadata), and its ServiceAccount (minio-sa) renders
  # with no labels or annotations whatsoever. Matched by name rather than selector, since that
  # ServiceAccount has nothing to select on. Scoped to namespace "default" -- the minio subchart's
  # templates never set metadata.namespace at all (confirmed empirically against the rendered
  # output), so every one of its resources lands in "default" regardless of the release namespace
  # `make template`/kyverno apply otherwise use. mimir-distributed's own templates (everything
  # else in that chart) are fully compliant without an exception -- see the
  # mimir-distributed-kyverno-fix memory for the full fix history.
  mimir-distributed-minio:
    policies: [require-resource-labels, require-resource-annotations, require-explicit-automount, require-resource-requests-limits, require-emptydir-sizelimit]
    match:
      kinds: [ConfigMap, Deployment, Job, PersistentVolumeClaim, Secret, Service, ServiceAccount]
      namespaces: [default]
      names: ["*minio*"]

  # packages/mimir-distributed's bundled `rollout-operator` dependency (alias rollout_operator)
  # supports its own global.commonLabels knob (set in mimir-distributed's own base.values.yaml),
  # which covers required labels on its Deployment/Role/RoleBinding/Service/ServiceAccount -- but
  # it has no equivalent commonAnnotations knob, and its 4 webhook RBAC templates
  # (webhook-clusterrole/-clusterrolebinding/-role/-rolebinding) render literally no
  # metadata.labels/annotations block at all. Matched by name rather than selector since those 4
  # have nothing to select on. Namespaces cover both halves: the webhook ClusterRole/
  # ClusterRoleBinding are cluster-scoped and land in "default" under kyverno apply (same as
  # minio's namespace-less templates above), the rest render into mimir-distributed's own release
  # namespace.
  mimir-distributed-rollout-operator:
    policies: [require-resource-labels, require-resource-annotations, require-explicit-automount]
    match:
      kinds: [ClusterRole, ClusterRoleBinding, Role, RoleBinding, Deployment, Service, ServiceAccount]
      namespaces: [default, mimir-distributed]
      names: ["*rollout-operator*"]
