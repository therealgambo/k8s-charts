###### disallow-rbac-escalation-verbs / escalate
#
# metadata.namespace below is a kyverno-test-CLI-only workaround, not a real field a live
# ClusterRole/ClusterRoleBinding/etc. would ever carry: this offline test harness appears to key
# its own exclude-namespace matching off whatever `metadata.namespace` a fixture carries even for
# cluster-scoped kinds, and defaults an UNSET one to "default" -- which collides with this chart's
# `excludeNamespaces` (Release.Namespace defaults to "default" too, see values.yaml). A real
# AdmissionReview for a cluster-scoped object has no namespace at all, so a real cluster never hits
# this; setting `workloads` here only works around the CLI's own offline behavior.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: escalation-verbs-pass
  namespace: workloads
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: escalation-verbs-fail
  namespace: workloads
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["escalate"]

