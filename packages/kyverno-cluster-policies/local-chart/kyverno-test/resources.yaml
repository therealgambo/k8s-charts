# Pass/fail fixtures for kyverno-test.yaml, one pair per rule (see that file's header for why the
# 3 identity-gated rules only get a "fail" fixture). Namespaced fixtures deliberately live in the
# `workloads` namespace, never `default`/kube-node-lease/kube-public -- see kyverno-pod-policies'
# own kyverno-test/resources.yaml comment for why (every policy's exclude block would otherwise
# silently swallow them). Config-dependent rules (registries/nameservers/labels/RBAC allow-lists/
# gitops identities) are exercised against the values ci.values.yaml sets -- see that file.

###### require-labels / check-required-labels
---
apiVersion: v1
kind: Namespace
metadata:
  name: labels-pass
  labels:
    team: platform
---
apiVersion: v1
kind: Namespace
metadata:
  name: labels-fail
  labels: {}
---
# Regression fixture: an explicit `labels: null` (present-but-null, not absent/omitted) must not
# crash the dynamic-key optional lookup -- same class of CEL null-vs-absent gotcha as the
# list-typed fields elsewhere, checked here for a map-typed field instead.
apiVersion: v1
kind: Namespace
metadata:
  name: labels-null-fail
  labels: null

