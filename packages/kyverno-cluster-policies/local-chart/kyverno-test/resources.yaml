# Regression fixture: an explicit `initContainers: null` (present-but-null, not absent) must not
# crash the rule's null-coalesce -- see the documented CEL null-vs-absent gotcha in the README.
# This Pod's only real container is allowed, so it must still PASS despite the explicit null.
apiVersion: v1
kind: Pod
metadata:
  name: registries-null-initcontainers-pass
  namespace: workloads
spec:
  initContainers: null
  containers:
    - name: app
      image: ghcr.io/therealgambo/app:v1

