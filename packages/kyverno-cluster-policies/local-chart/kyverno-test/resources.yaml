###### require-emptydir-sizelimit / require-emptydir-sizelimit
---
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-sizelimit-pass
  namespace: workloads
spec:
  volumes:
    - name: scratch
      emptyDir:
        sizeLimit: 100Mi
  containers:
    - name: app
      image: dummyimagename:v1
---
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-sizelimit-fail
  namespace: workloads
spec:
  volumes:
    - name: scratch
      emptyDir: {}
  containers:
    - name: app
      image: dummyimagename:v1
---
# Regression fixture: a Pod with no emptyDir volume at all must not be flagged (celPreconditions
# skip it), and an explicit `volumes: null` must not crash that precondition -- same documented
# CEL gotcha as above, applied to the precondition expression itself this time.
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-sizelimit-no-volumes-skip
  namespace: workloads
spec:
  volumes: null
  containers:
    - name: app
      image: dummyimagename:v1

