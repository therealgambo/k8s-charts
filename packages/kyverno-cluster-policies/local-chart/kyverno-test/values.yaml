# Layered on top of values.yaml -> base.values.yaml -> ci.values.yaml -> ENV.values.yaml via
# `make kyverno-test PACKAGE=kyverno-cluster-policies`'s EXTRA_VALUES wiring (see the root
# Makefile's `kyverno-test` target) -- explicitly scoped to this test suite, never picked up by
# `make template`/`make kyverno-policy-check` or any other renderer of this chart. Populates every
# config/ allow-list and opts every Category F (disabled-by-default) policy in so kyverno-test's
# fixtures can actually exercise their CEL logic -- the chart's real shipped defaults (empty config
# lists, Category F off) are still what `values.yaml` alone renders, and what
# scripts/kyverno-policy-check.sh's fleet-wide gate uses (it now renders this chart the same way as
# any other package, via `make template`, which never reads this file).
config:
  requiredNamespaceLabels: [team]
  requiredResourceLabels: [team]
  requiredResourceAnnotations: [example.com/owner]
  allowedRegistries: [ghcr.io/therealgambo/]
  allowedNameservers: [169.254.25.10]
  rbacDefinitionAllowedClusterRoles: [view]
  kargoAllowedTargets: [staging]
  karpenterAllowedInstanceProfiles: [approved-node-profile]
  # Deliberately a DIFFERENT identity than kyverno-test/userinfo.yaml's username -- every
  # identity-gated fixture (protect-kyverno-resources, disallow-webhook-tampering,
  # restrict-crd-creation) is evaluated as that non-matching identity, so this proves the "wrong
  # identity is blocked" direction. See kyverno-test/kyverno-test.yaml's header comment for why the
  # "right identity is allowed" direction isn't separately fixture-tested here.
  gitopsIdentities: [system:serviceaccount:argo-cd:argocd-application-controller]

policies:
  restrict-rbacdefinition-clusterrole:
    enabled: true
  restrict-argocd-application-project:
    enabled: true
  restrict-kargo-promotion-scope:
    enabled: true
  restrict-karpenter-nodeclass-profile:
    enabled: true
  restrict-crd-creation:
    enabled: true
