# Kyverno compliance: add required labels and annotations to subcharts that support commonLabels
postgresql:
  commonLabels:
    metadata.example.com/team: "database"
  commonAnnotations:
    metadata.example.com/repository: "https://github.com/therealgambo/k8s-charts"
  # Add resource requests/limits and emptyDir sizeLimit for Kyverno policies
  primary:
    persistence:
      enabled: true
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi
  shmVolume:
    enabled: true
    sizeLimit: 256Mi
  metrics:
    enabled: false

redis:
  commonLabels:
    metadata.example.com/team: "cache"
  commonAnnotations:
    metadata.example.com/repository: "https://github.com/therealgambo/k8s-charts"
  # Add resource requests/limits for Kyverno policies
  master:
    persistence:
      enabled: true
      sizeLimit: 2Gi
    resources:
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

# Add required annotations and resource limits to main Infisical deployment (labels handled via template patch)
infisical:
  podAnnotations:
    metadata.example.com/repository: "https://github.com/therealgambo/k8s-charts"
  deploymentAnnotations:
    metadata.example.com/repository: "https://github.com/therealgambo/k8s-charts"
  serviceAccount:
    annotations:
      metadata.example.com/repository: "https://github.com/therealgambo/k8s-charts"
  # Add missing memory request to satisfy require-resource-requests-limits policy
  resources:
    limits:
      memory: 1000Mi
    requests:
      cpu: 350m
      memory: 500Mi

# Disable bundled nginx-ingress chart
ingress:
  nginx:
    enabled: false
  annotations:
    metadata.example.com/repository: "https://github.com/therealgambo/k8s-charts"
