suite: policy toggles
release:
  namespace: kyverno-pod-policies
templates:
  - disallow-privileged-containers.yaml
  - disallow-host-ports.yaml
  - require-run-as-nonroot.yaml
tests:
  - it: renders a baseline policy with failureAction Enforce and the default merged exclude namespaces
    template: disallow-privileged-containers.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ClusterPolicy
      - isAPIVersion:
          of: kyverno.io/v1
      - equal:
          path: metadata.name
          value: disallow-privileged-containers
      - equal:
          path: spec.background
          value: true
      - equal:
          path: spec.rules[0].validate.failureAction
          value: Enforce
      - equal:
          path: spec.rules[0].exclude.any[0].resources.namespaces
          value: [kube-node-lease, kube-public, kyverno-pod-policies]

  - it: renders a restricted policy with failureAction Audit by default
    template: require-run-as-nonroot.yaml
    asserts:
      - equal:
          path: spec.rules[0].validate.failureAction
          value: Audit

  - it: policies.<id>.enabled false skips that policy only
    template: disallow-privileged-containers.yaml
    set:
      policies:
        disallow-privileged-containers:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: per-policy validationFailureAction override wins over the tier default
    template: require-run-as-nonroot.yaml
    set:
      policies:
        require-run-as-nonroot:
          validationFailureAction: Enforce
    asserts:
      - equal:
          path: spec.rules[0].validate.failureAction
          value: Enforce

  - it: the global validationFailureAction override wins over a per-policy override
    template: require-run-as-nonroot.yaml
    set:
      validationFailureAction: Audit
      policies:
        require-run-as-nonroot:
          validationFailureAction: Enforce
    asserts:
      - equal:
          path: spec.rules[0].validate.failureAction
          value: Audit

  - it: master switch enabled=false skips every policy
    set:
      enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: excludeNamespaces and a per-policy exclude.namespaces are both merged in, deduped and sorted
    template: disallow-privileged-containers.yaml
    set:
      excludeNamespaces: [kube-node-lease, kube-public, cert-manager]
      policies:
        disallow-privileged-containers:
          exclude:
            namespaces: [istio-system]
    asserts:
      - equal:
          path: spec.rules[0].exclude.any[0].resources.namespaces
          value: [cert-manager, istio-system, kube-node-lease, kube-public, kyverno-pod-policies]

  - it: a per-policy exclude.kinds renders exclude.any[0].resources.kinds
    template: disallow-host-ports.yaml
    set:
      policies:
        disallow-host-ports:
          exclude:
            kinds: [CronJob]
    asserts:
      - equal:
          path: spec.rules[0].exclude.any[0].resources.kinds
          value: [CronJob]

  - it: exclude.any[0].resources has no kinds key when no policy sets exclude.kinds
    template: disallow-host-ports.yaml
    asserts:
      - notExists:
          path: spec.rules[0].exclude.any[0].resources.kinds

  - it: stamps commonLabels onto the rendered ClusterPolicy
    template: disallow-privileged-containers.yaml
    set:
      commonLabels:
        team: platform
    asserts:
      - equal:
          path: metadata.labels.team
          value: platform
