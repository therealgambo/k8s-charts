{{/*
Baseline PSS control: no host namespaces.
https://kyverno.io/policies/pod-security-cel/baseline/disallow-host-namespaces/disallow-host-namespaces/
*/}}
{{- $id := "disallow-host-namespaces" }}
{{- if ne .Values.enabled false }}
{{- if eq (include "kyverno-pod-policies.policyEnabled" (dict "id" $id "root" $)) "true" }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $id }}
  labels:
    {{- include "kyverno-pod-policies.labels" $ | nindent 4 }}
    {{- with .Values.commonLabels }}{{- toYaml . | nindent 4 }}{{- end }}
  annotations:
    policies.kyverno.io/title: Disallow Host Namespaces
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Host namespaces (Process ID, Inter-Process Communication, and Network) allow a pod to share
      the corresponding namespace of the underlying host, breaking the isolation between pod and
      node. Sharing the host namespaces must be disallowed.
    {{- with .Values.commonAnnotations }}{{- toYaml . | nindent 4 }}{{- end }}
spec:
  background: {{ .Values.background | default true }}
  rules:
    - name: host-namespaces
      match:
        any:
          - resources: { kinds: [Pod], operations: [CREATE, UPDATE] }
      exclude:
        {{- include "kyverno-pod-policies.exclude" (dict "id" $id "root" $) | nindent 8 }}
      validate:
        failureAction: {{ include "kyverno-pod-policies.failureAction" (dict "id" $id "tierDefault" "Enforce" "root" $) }}
        cel:
          expressions:
            - expression: >-
                object.spec.?hostNetwork.orValue(false) == false &&
                object.spec.?hostIPC.orValue(false) == false &&
                object.spec.?hostPID.orValue(false) == false
              message: >-
                Sharing the host's network, IPC or PID namespace is disallowed. Unset
                hostNetwork/hostIPC/hostPID, or set them explicitly to false.
{{- end }}
{{- end }}
