{{/*
Restricted PSS control: only a known-safe subset of volume types may be used.
https://kyverno.io/policies/pod-security-cel/restricted/restrict-volume-types/restrict-volume-types/
*/}}
{{- $id := "restrict-volume-types" }}
{{- if ne .Values.enabled false }}
{{- if eq (include "kyverno-pod-policies.policyEnabled" (dict "id" $id "root" $)) "true" }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $id }}
  labels:
    {{- include "kyverno-pod-policies.labels" $ | nindent 4 }}
    {{- with .Values.commonLabels }}{{- toYaml . | nindent 4 }}{{- end }}
  annotations:
    policies.kyverno.io/title: Restrict Volume Types
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      In addition to restricting HostPath volumes (baseline), the restricted profile limits the
      use of non-core volume types to those defined through PersistentVolumes.
    {{- with .Values.commonAnnotations }}{{- toYaml . | nindent 4 }}{{- end }}
spec:
  background: {{ .Values.background | default true }}
  rules:
    - name: restricted-volumes
      match:
        any:
          - resources: { kinds: [Pod], operations: [CREATE, UPDATE] }
      exclude:
        {{- include "kyverno-pod-policies.exclude" (dict "id" $id "root" $) | nindent 8 }}
      validate:
        failureAction: {{ include "kyverno-pod-policies.failureAction" (dict "id" $id "tierDefault" "Audit" "root" $) }}
        cel:
          expressions:
            - expression: >-
                object.spec.?volumes.orValue([]).all(volume,
                  has(volume.configMap) || has(volume.csi) || has(volume.downwardAPI) ||
                  has(volume.emptyDir) || has(volume.ephemeral) ||
                  has(volume.persistentVolumeClaim) || has(volume.projected) || has(volume.secret))
              message: >-
                Only the following volume types are allowed: configMap, csi, downwardAPI,
                emptyDir, ephemeral, persistentVolumeClaim, projected, secret.
{{- end }}
{{- end }}
