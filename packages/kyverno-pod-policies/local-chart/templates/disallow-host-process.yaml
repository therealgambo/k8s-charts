{{/*
Baseline PSS control: no Windows HostProcess containers.
https://kyverno.io/policies/pod-security-cel/baseline/disallow-host-process/disallow-host-process/
*/}}
{{- $id := "disallow-host-process" }}
{{- if ne .Values.enabled false }}
{{- if eq (include "kyverno-pod-policies.policyEnabled" (dict "id" $id "root" $)) "true" }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $id }}
  labels:
    {{- include "kyverno-pod-policies.labels" $ | nindent 4 }}
    {{- with .Values.commonLabels }}{{- toYaml . | nindent 4 }}{{- end }}
  annotations:
    policies.kyverno.io/title: Disallow hostProcess
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Windows HostProcess containers run directly on the host with elevated privileges and must
      be disallowed (no-op on Linux nodes, kept for parity with the full PSS baseline profile).
    {{- with .Values.commonAnnotations }}{{- toYaml . | nindent 4 }}{{- end }}
spec:
  background: {{ .Values.background | default true }}
  rules:
    - name: host-process-containers
      match:
        any:
          - resources: { kinds: [Pod], operations: [CREATE, UPDATE] }
      exclude:
        {{- include "kyverno-pod-policies.exclude" (dict "id" $id "root" $) | nindent 8 }}
      validate:
        failureAction: {{ include "kyverno-pod-policies.failureAction" (dict "id" $id "tierDefault" "Enforce" "root" $) }}
        cel:
          variables:
            - name: allContainers
              expression: >-
                object.spec.containers + object.spec.?initContainers.orValue([]) +
                object.spec.?ephemeralContainers.orValue([])
          expressions:
            - expression: >-
                object.spec.?securityContext.?windowsOptions.?hostProcess.orValue(false) == false &&
                variables.allContainers.all(container,
                  container.?securityContext.?windowsOptions.?hostProcess.orValue(false) == false)
              message: "Windows HostProcess containers are disallowed."
{{- end }}
{{- end }}
