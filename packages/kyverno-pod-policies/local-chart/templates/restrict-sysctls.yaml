{{/*
Baseline PSS control: only a known-safe subset of sysctls may be set.
https://kyverno.io/policies/pod-security-cel/baseline/restrict-sysctls/restrict-sysctls/
*/}}
{{- $id := "restrict-sysctls" }}
{{- if ne .Values.enabled false }}
{{- if eq (include "kyverno-pod-policies.policyEnabled" (dict "id" $id "root" $)) "true" }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $id }}
  labels:
    {{- include "kyverno-pod-policies.labels" $ | nindent 4 }}
    {{- with .Values.commonLabels }}{{- toYaml . | nindent 4 }}{{- end }}
  annotations:
    policies.kyverno.io/title: Restrict sysctls
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Sysctls can disable security mechanisms or affect all containers on a host, and should be
      restricted to a known-safe subset.
    {{- with .Values.commonAnnotations }}{{- toYaml . | nindent 4 }}{{- end }}
spec:
  background: {{ .Values.background | default true }}
  rules:
    - name: check-sysctls
      match:
        any:
          - resources: { kinds: [Pod], operations: [CREATE, UPDATE] }
      exclude:
        {{- include "kyverno-pod-policies.exclude" (dict "id" $id "root" $) | nindent 8 }}
      validate:
        failureAction: {{ include "kyverno-pod-policies.failureAction" (dict "id" $id "tierDefault" "Enforce" "root" $) }}
        cel:
          variables:
            - name: allowedSysctls
              expression: >-
                ['kernel.shm_rmid_forced', 'net.ipv4.ip_local_port_range',
                 'net.ipv4.ip_unprivileged_port_start', 'net.ipv4.tcp_syncookies',
                 'net.ipv4.ping_group_range']
          expressions:
            - expression: >-
                object.spec.?securityContext.?sysctls.orValue([]).all(sysctl,
                  sysctl.name in variables.allowedSysctls)
              message: >-
                Setting a sysctl outside the safe subset
                (kernel.shm_rmid_forced,net.ipv4.ip_local_port_range,
                net.ipv4.ip_unprivileged_port_start,net.ipv4.tcp_syncookies,
                net.ipv4.ping_group_range) is disallowed.
{{- end }}
{{- end }}
