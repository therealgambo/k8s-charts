{{/*
Restricted PSS control: every container's EFFECTIVE seccomp profile (its own override, or the pod
default it inherits) must be explicitly RuntimeDefault or Localhost -- unlike the baseline
restrict-seccomp control, leaving it unset everywhere now also fails.
https://kyverno.io/policies/pod-security-cel/restricted/restrict-seccomp-strict/restrict-seccomp-strict/
*/}}
{{- $id := "restrict-seccomp-strict" }}
{{- if ne .Values.enabled false }}
{{- if eq (include "kyverno-pod-policies.policyEnabled" (dict "id" $id "root" $)) "true" }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $id }}
  labels:
    {{- include "kyverno-pod-policies.labels" $ | nindent 4 }}
    {{- with .Values.commonLabels }}{{- toYaml . | nindent 4 }}{{- end }}
  annotations:
    policies.kyverno.io/title: Restrict Seccomp (Strict)
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      On top of the baseline seccomp check, every container's effective seccomp profile (its own
      override, or the pod-level default it would otherwise inherit) must be explicitly set to
      RuntimeDefault or Localhost -- leaving it unset everywhere is no longer sufficient.
    {{- with .Values.commonAnnotations }}{{- toYaml . | nindent 4 }}{{- end }}
spec:
  background: {{ .Values.background | default true }}
  rules:
    - name: check-seccomp-strict
      match:
        any:
          - resources: { kinds: [Pod], operations: [CREATE, UPDATE] }
      exclude:
        {{- include "kyverno-pod-policies.exclude" (dict "id" $id "root" $) | nindent 8 }}
      validate:
        failureAction: {{ include "kyverno-pod-policies.failureAction" (dict "id" $id "tierDefault" "Audit" "root" $) }}
        cel:
          variables:
            - name: allContainers
              expression: >-
                object.spec.containers + object.spec.?initContainers.orValue([]) +
                object.spec.?ephemeralContainers.orValue([])
            - name: allowedTypes
              expression: "['RuntimeDefault', 'Localhost']"
            - name: podLevelType
              expression: object.spec.?securityContext.?seccompProfile.?type.orValue('')
          expressions:
            - expression: >-
                variables.allContainers.all(container,
                  container.?securityContext.?seccompProfile.?type.orValue(variables.podLevelType) in variables.allowedTypes)
              message: >-
                Every container's effective seccompProfile.type (its own, or the pod-level
                default it inherits) must be RuntimeDefault or Localhost.
{{- end }}
{{- end }}
