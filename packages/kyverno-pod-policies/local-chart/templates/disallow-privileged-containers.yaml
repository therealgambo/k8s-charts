{{/*
Baseline PSS control: no privileged containers.
https://kyverno.io/policies/pod-security-cel/baseline/disallow-privileged-containers/disallow-privileged-containers/
*/}}
{{- $id := "disallow-privileged-containers" }}
{{- if ne .Values.enabled false }}
{{- if eq (include "kyverno-pod-policies.policyEnabled" (dict "id" $id "root" $)) "true" }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $id }}
  labels:
    {{- include "kyverno-pod-policies.labels" $ | nindent 4 }}
    {{- with .Values.commonLabels }}{{- toYaml . | nindent 4 }}{{- end }}
  annotations:
    policies.kyverno.io/title: Disallow Privileged Containers
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Privileged mode disables most security mechanisms and must not be allowed.
    {{- with .Values.commonAnnotations }}{{- toYaml . | nindent 4 }}{{- end }}
spec:
  background: {{ .Values.background | default true }}
  rules:
    - name: privileged-containers
      match:
        any:
          - resources: { kinds: [Pod], operations: [CREATE, UPDATE] }
      exclude:
        {{- include "kyverno-pod-policies.exclude" (dict "id" $id "root" $) | nindent 8 }}
      validate:
        failureAction: {{ include "kyverno-pod-policies.failureAction" (dict "id" $id "tierDefault" "Enforce" "root" $) }}
        cel:
          variables:
            - name: initContainers
              expression: object.spec.?initContainers.orValue([])
            - name: ephemeralContainers
              expression: object.spec.?ephemeralContainers.orValue([])
            - name: allContainers
              expression: >-
                object.spec.containers +
                (variables.initContainers == null ? [] : variables.initContainers) +
                (variables.ephemeralContainers == null ? [] : variables.ephemeralContainers)
          expressions:
            - expression: >-
                variables.allContainers.all(container,
                  container.?securityContext.?privileged.orValue(false) == false)
              message: >-
                Privileged mode is disallowed. Unset securityContext.privileged on every
                container, or set it explicitly to false.
{{- end }}
{{- end }}
