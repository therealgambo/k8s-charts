{{/*
Baseline PSS control: restrict SELinux type, forbid setting SELinux user/role.
https://kyverno.io/policies/pod-security-cel/baseline/disallow-selinux/disallow-selinux/
*/}}
{{- $id := "disallow-selinux" }}
{{- if ne .Values.enabled false }}
{{- if eq (include "kyverno-pod-policies.policyEnabled" (dict "id" $id "root" $)) "true" }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $id }}
  labels:
    {{- include "kyverno-pod-policies.labels" $ | nindent 4 }}
    {{- with .Values.commonLabels }}{{- toYaml . | nindent 4 }}{{- end }}
  annotations:
    policies.kyverno.io/title: Disallow SELinux
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      SELinux options can be used to escalate privileges. Setting the SELinux type is restricted
      to a known-safe allow-list, and setting the SELinux user or role is forbidden outright.
    {{- with .Values.commonAnnotations }}{{- toYaml . | nindent 4 }}{{- end }}
spec:
  background: {{ .Values.background | default true }}
  rules:
    - name: selinux-type
      match:
        any:
          - resources: { kinds: [Pod], operations: [CREATE, UPDATE] }
      exclude:
        {{- include "kyverno-pod-policies.exclude" (dict "id" $id "root" $) | nindent 8 }}
      validate:
        failureAction: {{ include "kyverno-pod-policies.failureAction" (dict "id" $id "tierDefault" "Enforce" "root" $) }}
        cel:
          variables:
            - name: initContainers
              expression: object.spec.?initContainers.orValue([])
            - name: ephemeralContainers
              expression: object.spec.?ephemeralContainers.orValue([])
            - name: allContainers
              expression: >-
                object.spec.containers +
                (variables.initContainers == null ? [] : variables.initContainers) +
                (variables.ephemeralContainers == null ? [] : variables.ephemeralContainers)
            - name: allowedTypes
              expression: "['container_t', 'container_init_t', 'container_kvm_t']"
          expressions:
            - expression: >-
                (object.spec.?securityContext.?seLinuxOptions.?type.orValue('container_t') in variables.allowedTypes) &&
                variables.allContainers.all(container,
                  container.?securityContext.?seLinuxOptions.?type.orValue('container_t') in variables.allowedTypes)
              message: >-
                Setting the SELinux type is restricted to container_t, container_init_t, or
                container_kvm_t.
    - name: selinux-user-role
      match:
        any:
          - resources: { kinds: [Pod], operations: [CREATE, UPDATE] }
      exclude:
        {{- include "kyverno-pod-policies.exclude" (dict "id" $id "root" $) | nindent 8 }}
      validate:
        failureAction: {{ include "kyverno-pod-policies.failureAction" (dict "id" $id "tierDefault" "Enforce" "root" $) }}
        cel:
          variables:
            - name: initContainers
              expression: object.spec.?initContainers.orValue([])
            - name: ephemeralContainers
              expression: object.spec.?ephemeralContainers.orValue([])
            - name: allContainers
              expression: >-
                object.spec.containers +
                (variables.initContainers == null ? [] : variables.initContainers) +
                (variables.ephemeralContainers == null ? [] : variables.ephemeralContainers)
          expressions:
            - expression: >-
                object.spec.?securityContext.?seLinuxOptions.?user.orValue('') == '' &&
                object.spec.?securityContext.?seLinuxOptions.?role.orValue('') == '' &&
                variables.allContainers.all(container,
                  container.?securityContext.?seLinuxOptions.?user.orValue('') == '' &&
                  container.?securityContext.?seLinuxOptions.?role.orValue('') == '')
              message: "Setting the SELinux user or role is forbidden."
{{- end }}
{{- end }}
