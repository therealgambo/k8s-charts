{{/*
Baseline PSS control: no hostPorts.
https://kyverno.io/policies/pod-security-cel/baseline/disallow-host-ports/disallow-host-ports/
*/}}
{{- $id := "disallow-host-ports" }}
{{- if ne .Values.enabled false }}
{{- if eq (include "kyverno-pod-policies.policyEnabled" (dict "id" $id "root" $)) "true" }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $id }}
  labels:
    {{- include "kyverno-pod-policies.labels" $ | nindent 4 }}
    {{- with .Values.commonLabels }}{{- toYaml . | nindent 4 }}{{- end }}
  annotations:
    policies.kyverno.io/title: Disallow hostPorts
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Access to host ports allows potential snooping of network traffic and should, at minimum,
      be restricted. This policy disallows any non-zero hostPort outright; see the README for a
      copy-pasteable variant that instead restricts hostPort to a fixed range.
    {{- with .Values.commonAnnotations }}{{- toYaml . | nindent 4 }}{{- end }}
spec:
  background: {{ .Values.background | default true }}
  rules:
    - name: host-ports-none
      match:
        any:
          - resources: { kinds: [Pod], operations: [CREATE, UPDATE] }
      exclude:
        {{- include "kyverno-pod-policies.exclude" (dict "id" $id "root" $) | nindent 8 }}
      validate:
        failureAction: {{ include "kyverno-pod-policies.failureAction" (dict "id" $id "tierDefault" "Enforce" "root" $) }}
        cel:
          variables:
            - name: initContainers
              expression: object.spec.?initContainers.orValue([])
            - name: ephemeralContainers
              expression: object.spec.?ephemeralContainers.orValue([])
            - name: allContainers
              expression: >-
                object.spec.containers +
                (variables.initContainers == null ? [] : variables.initContainers) +
                (variables.ephemeralContainers == null ? [] : variables.ephemeralContainers)
          expressions:
            - expression: >-
                variables.allContainers.map(container, container.?ports.orValue([]))
                  .all(ports, (ports == null ? [] : ports).all(port, port.?hostPort.orValue(0) == 0))
              message: "Use of host ports is disallowed."
{{- end }}
{{- end }}
