# Pass/fail Pod fixtures for kyverno-test.yaml, one pair per rule. All in the `workloads`
# namespace deliberately -- see the comment at the top of kyverno-test.yaml for why it must not be
# `default`/kube-node-lease/kube-public.

###### disallow-privileged-containers / privileged-containers
---
apiVersion: v1
kind: Pod
metadata:
  name: privileged-containers-pass
  namespace: workloads
spec:
  containers:
    - name: app
      image: dummyimagename
---
apiVersion: v1
kind: Pod
metadata:
  name: privileged-containers-fail
  namespace: workloads
spec:
  containers:
    - name: app
      image: dummyimagename
      securityContext:
        privileged: true

