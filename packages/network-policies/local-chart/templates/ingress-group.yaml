{{/*
One CiliumNetworkPolicy per workload in .Values.rules that populates `ingress.groups`,
allowing/denying ingress from CIDRs sourced from an external integration (currently AWS security
groups only, per upstream Cilium).
*/}}
{{- if ne .Values.enabled false }}
{{- $root := . }}
{{- $fileBase := include "network-policies.fileBase" $root }}
{{- range $key, $rule := .Values.rules }}
{{- $rule := $rule | default dict }}
{{- if ne $rule.enabled false }}
{{- $ing := $rule.ingress | default dict }}
{{- if $ing.groups }}
{{- $parts := include "network-policies.partitionByDeny" $ing.groups | fromYaml }}
{{- $allowList := list }}
{{- if $parts.allow }}{{- $allowList = include "network-policies.groupEntries" (dict "entries" $parts.allow "field" "fromGroups" "mode" "allow") | fromYamlArray }}{{- end }}
{{- $denyList := list }}
{{- if $parts.deny }}{{- $denyList = include "network-policies.groupEntries" (dict "entries" $parts.deny "field" "fromGroups" "mode" "deny") | fromYamlArray }}{{- end }}
{{- include "network-policies.emitResource" (dict "root" $root "fileBase" $fileBase "key" $key "cfg" $rule "direction" "ingress" "allowEntries" $allowList "denyEntries" $denyList) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
