apiVersion: v2
name: network-policies
description: >-
  Renders CiliumNetworkPolicy / CiliumClusterwideNetworkPolicy resources from a declarative,
  merge-friendly values schema. Add as a dependency of any chart that needs network policies to
  get consistent policy structure, naming and Cluster Mesh support across the estate.
type: application
version: 0.1.0
appVersion: "1.20.0"
kubeVersion: ">= 1.24.0-0"
home: https://github.com/therealgambo/k8s-charts
sources:
  - https://github.com/therealgambo/k8s-charts
  - https://github.com/cilium/cilium
keywords:
  - cilium
  - network-policy
  - security
  - clustermesh
  - ciliumnetworkpolicy
maintainers:
  - name: therealgambo
