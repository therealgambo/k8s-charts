global:
  commonLabels:
    metadata.example.com/team: tempo
  commonAnnotations:
    metadata.example.com/repository: https://github.com/therealgambo/k8s-charts

defaults:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 1Gi

memcached:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

memcachedExporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
