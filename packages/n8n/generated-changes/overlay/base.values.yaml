# require-resource-labels / require-resource-annotations (kyverno-cluster-policies): n8n.labels
# already renders .Values.commonLabels via toYaml and is included by every RBAC/workload/test-hook
# template the policies flag; commonAnnotations is likewise rendered directly wherever annotations
# are emitted. Setting both here alone clears both policies fleet-wide for this chart.
commonLabels:
  metadata.example.com/team: demo-team
commonAnnotations:
  metadata.example.com/repository: https://github.com/therealgambo/k8s-charts

serviceAccount:
  # require-explicit-automount (kyverno-cluster-policies): serviceAccount.automountServiceAccountToken
  # is applied at the pod-spec level on every Deployment (main/worker/webhook-processor) per the
  # chart's own values.yaml comment, so setting it explicitly clears the policy without a template
  # edit. n8n workloads don't call the Kubernetes API, so disabling the token is also the correct
  # hardening choice, not just a policy workaround.
  automountServiceAccountToken: false
