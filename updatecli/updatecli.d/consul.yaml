name: "Bump consul chart to the latest upstream release"

scms:
  default:
    kind: github
    spec:
      owner: '{{ .github.owner }}'
      repository: '{{ .github.repository }}'
      branch: '{{ .github.branch }}'
      # Matches whoever GITHUB_TOKEN actually authenticates as (the
      # updatecli GitHub App in CI, or a human token for local runs) rather
      # than a hardcoded identity.
      user: '{{ requiredEnv "GITHUB_ACTOR" }}'
      email: '{{ requiredEnv "GITHUB_ACTOR" }}@users.noreply.github.com'
      username: "x-access-token"
      token: '{{ requiredEnv "GITHUB_TOKEN" }}'
      commitmessage:
        type: "chore"
        scope: "consul"

# The chart is published to the classic helm.releases.hashicorp.com repo,
# which doesn't tag/release independently - so track hashicorp/consul-k8s's
# own "vX.Y.Z" releases instead (its chart version and CLI version move
# together) and derive the asset URL from that.
sources:
  lastRelease:
    name: "Get the latest consul-k8s release"
    kind: githubrelease
    spec:
      owner: "hashicorp"
      repository: "consul-k8s"
      token: '{{ requiredEnv "GITHUB_TOKEN" }}'
      versionfilter:
        kind: "regex"
        pattern: '^v\d+\.\d+\.\d+$'
    transformers:
      - findsubmatch:
          pattern: '^v(\d+\.\d+\.\d+)$'
          captureindex: 1

conditions:
  chartAssetPublished:
    name: "Check the release tgz asset is published"
    kind: shell
    disablesourceinput: true
    spec:
      command: >-
        curl --fail --silent --show-error --location --output /dev/null
        "https://helm.releases.hashicorp.com/consul-{{ source "lastRelease" }}.tgz"

  # buildChart below always "succeeds with output" (make's own logging is
  # never empty), so updatecli can't tell from the shell target alone
  # whether a rebuild was actually necessary - it would run make on every
  # scheduled check and then error out with "no changed file to commit"
  # once nothing was left to stage. Gate the whole pipeline here instead:
  # skip cleanly, before any target runs, unless this release isn't already
  # applied. failwhen inverts the normal yaml-condition pass criteria
  # (equal = pass) into "equal = stop the pipeline here, cleanly".
  upstreamVersionChanged:
    name: "Only continue if this release isn't already applied"
    kind: yaml
    scmid: "default"
    disablesourceinput: true
    failwhen: true
    spec:
      file: "packages/consul/package.yaml"
      key: "$.url"
      value: 'https://helm.releases.hashicorp.com/consul-{{ source "lastRelease" }}.tgz'

targets:
  packageURL:
    name: "Point packages/consul/package.yaml at the new release asset"
    kind: yaml
    sourceid: "lastRelease"
    scmid: "default"
    spec:
      file: "packages/consul/package.yaml"
      key: "$.url"
      value: 'https://helm.releases.hashicorp.com/consul-{{ source "lastRelease" }}.tgz'

  packageBuildVersion:
    name: "Reset packageVersion to 01 for the new upstream release"
    kind: yaml
    sourceid: "lastRelease"
    scmid: "default"
    spec:
      file: "packages/consul/package.yaml"
      key: "$.packageVersion"
      engine: "yamlpath"
      value: "01"

  buildChart:
    name: "Regenerate the chart via charts-build-scripts"
    kind: shell
    scmid: "default"
    disablesourceinput: true
    dependson:
      - "packageURL"
      - "packageBuildVersion"
    spec:
      command: "make prepare PACKAGE=consul && make patch PACKAGE=consul && make charts PACKAGE=consul && make clean PACKAGE=consul"

actions:
  default:
    kind: "github/pullrequest"
    scmid: "default"
    spec:
      title: 'chore(consul): bump chart to {{ source "lastRelease" }}'
      description: |
        Automated upstream sync via [updatecli](https://www.updatecli.io/).

        Pulls in `consul` `{{ source "lastRelease" }}` and regenerates
        the chart via `make prepare`, `make patch` and `make charts`. Review
        the diff under `packages/consul/` as
        you would any other chart bump before merging.
      labels:
        - "dependencies"
        - "consul"
