name: "Bump cert-manager chart to the latest upstream release"

scms:
  default:
    kind: github
    spec:
      owner: '{{ .github.owner }}'
      repository: '{{ .github.repository }}'
      branch: '{{ .github.branch }}'
      # Matches whoever GITHUB_TOKEN actually authenticates as (the
      # updatecli GitHub App in CI, or a human token for local runs) rather
      # than a hardcoded identity.
      user: '{{ requiredEnv "GITHUB_ACTOR" }}'
      email: '{{ requiredEnv "GITHUB_ACTOR" }}@users.noreply.github.com'
      username: "x-access-token"
      token: '{{ requiredEnv "GITHUB_TOKEN" }}'
      commitmessage:
        type: "chore"
        scope: "cert-manager"

# cert-manager's chart isn't a GitHub release asset - it's published as an
# OCI artifact to quay.io/jetstack/charts/cert-manager. Query the registry
# directly for tags. Every release is double-tagged both "X.Y.Z" and
# "vX.Y.Z" (plus a pile of "sha256-....sig" cosign signature tags) - the
# tagfilter pins us to the "v"-prefixed convention that's already pinned in
# package.yaml, and semver constraint matching only considers pre-release
# tags (-alpha.0, -beta.0) when the constraint itself has a pre-release
# component, so ">=0.0.0" naturally selects the newest stable tag.
sources:
  lastRelease:
    name: "Get the latest cert-manager helm chart release"
    kind: dockerimage
    spec:
      image: "quay.io/jetstack/charts/cert-manager"
      tagfilter: '^v\d+\.\d+\.\d+$'
      versionfilter:
        kind: "semver"
        pattern: ">=0.0.0"

conditions:
  chartTagPublished:
    name: "Check the release OCI tag is published"
    kind: dockerimage
    disablesourceinput: true
    spec:
      image: "quay.io/jetstack/charts/cert-manager"
      tag: '{{ source "lastRelease" }}'

  # buildChart below always "succeeds with output" (make's own logging is
  # never empty), so updatecli can't tell from the shell target alone
  # whether a rebuild was actually necessary - it would run make on every
  # scheduled check and then error out with "no changed file to commit"
  # once nothing was left to stage. Gate the whole pipeline here instead:
  # skip cleanly, before any target runs, unless this release isn't already
  # applied. failwhen inverts the normal yaml-condition pass criteria
  # (equal = pass) into "equal = stop the pipeline here, cleanly".
  upstreamVersionChanged:
    name: "Only continue if this release isn't already applied"
    kind: yaml
    scmid: "default"
    disablesourceinput: true
    failwhen: true
    spec:
      file: "packages/cert-manager/package.yaml"
      key: "$.url"
      value: 'oci://quay.io/jetstack/charts/cert-manager:{{ source "lastRelease" }}'

targets:
  packageURL:
    name: "Point packages/cert-manager/package.yaml at the new release tag"
    kind: yaml
    sourceid: "lastRelease"
    scmid: "default"
    spec:
      file: "packages/cert-manager/package.yaml"
      key: "$.url"
      value: 'oci://quay.io/jetstack/charts/cert-manager:{{ source "lastRelease" }}'

  packageBuildVersion:
    name: "Reset packageVersion to 01 for the new upstream release"
    kind: yaml
    sourceid: "lastRelease"
    scmid: "default"
    spec:
      file: "packages/cert-manager/package.yaml"
      key: "$.packageVersion"
      engine: "yamlpath"
      value: "01"

  buildChart:
    name: "Regenerate the chart via charts-build-scripts"
    kind: shell
    scmid: "default"
    disablesourceinput: true
    dependson:
      - "packageURL"
      - "packageBuildVersion"
    spec:
      command: "make prepare PACKAGE=cert-manager && make patch PACKAGE=cert-manager && make charts PACKAGE=cert-manager && make clean PACKAGE=cert-manager"

actions:
  default:
    kind: "github/pullrequest"
    scmid: "default"
    spec:
      title: 'chore(cert-manager): bump chart to {{ source "lastRelease" }}'
      description: |
        Automated upstream sync via [updatecli](https://www.updatecli.io/).

        Pulls in `cert-manager` `{{ source "lastRelease" }}` and regenerates
        the chart via `make prepare`, `make patch` and `make charts`. Review
        the diff under `charts/`, `assets/` and `packages/cert-manager/` as
        you would any other chart bump before merging.
      labels:
        - "dependencies"
        - "cert-manager"
