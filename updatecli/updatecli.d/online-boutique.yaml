name: "Bump online-boutique chart to the latest upstream release"

scms:
  default:
    kind: github
    spec:
      owner: '{{ .github.owner }}'
      repository: '{{ .github.repository }}'
      branch: '{{ .github.branch }}'
      # Matches whoever GITHUB_TOKEN actually authenticates as (the
      # updatecli GitHub App in CI, or a human token for local runs) rather
      # than a hardcoded identity.
      user: '{{ requiredEnv "GITHUB_ACTOR" }}'
      email: '{{ requiredEnv "GITHUB_ACTOR" }}@users.noreply.github.com'
      username: "x-access-token"
      token: '{{ requiredEnv "GITHUB_TOKEN" }}'
      commitmessage:
        type: "chore"
        scope: "online-boutique"

# The chart is published as an OCI artifact to Google Artifact Registry
# (us-docker.pkg.dev/online-boutique-ci/charts/onlineboutique), which isn't
# a GitHub-backed registry and doesn't tag independently of the app - so
# track GoogleCloudPlatform/microservices-demo's own "vX.Y.Z" releases
# instead and derive the OCI tag from that version.
sources:
  lastRelease:
    name: "Get the latest microservices-demo release"
    kind: githubrelease
    spec:
      owner: "GoogleCloudPlatform"
      repository: "microservices-demo"
      token: '{{ requiredEnv "GITHUB_TOKEN" }}'
      versionfilter:
        kind: "regex"
        pattern: '^v\d+\.\d+\.\d+$'
    transformers:
      - findsubmatch:
          pattern: '^v(\d+\.\d+\.\d+)$'
          captureindex: 1

conditions:
  chartTagPublished:
    name: "Check the release OCI tag is published"
    kind: dockerimage
    disablesourceinput: true
    spec:
      image: "us-docker.pkg.dev/online-boutique-ci/charts/onlineboutique"
      tag: '{{ source "lastRelease" }}'

  # buildChart below always "succeeds with output" (make's own logging is
  # never empty), so updatecli can't tell from the shell target alone
  # whether a rebuild was actually necessary - it would run make on every
  # scheduled check and then error out with "no changed file to commit"
  # once nothing was left to stage. Gate the whole pipeline here instead:
  # skip cleanly, before any target runs, unless this release isn't already
  # applied. failwhen inverts the normal yaml-condition pass criteria
  # (equal = pass) into "equal = stop the pipeline here, cleanly".
  upstreamVersionChanged:
    name: "Only continue if this release isn't already applied"
    kind: yaml
    scmid: "default"
    disablesourceinput: true
    failwhen: true
    spec:
      file: "packages/online-boutique/package.yaml"
      key: "$.url"
      value: 'oci://us-docker.pkg.dev/online-boutique-ci/charts/onlineboutique:{{ source "lastRelease" }}'

targets:
  packageURL:
    name: "Point packages/online-boutique/package.yaml at the new release tag"
    kind: yaml
    sourceid: "lastRelease"
    scmid: "default"
    spec:
      file: "packages/online-boutique/package.yaml"
      key: "$.url"
      value: 'oci://us-docker.pkg.dev/online-boutique-ci/charts/onlineboutique:{{ source "lastRelease" }}'

  packageBuildVersion:
    name: "Reset packageVersion to 01 for the new upstream release"
    kind: yaml
    sourceid: "lastRelease"
    scmid: "default"
    spec:
      file: "packages/online-boutique/package.yaml"
      key: "$.packageVersion"
      engine: "yamlpath"
      value: "01"

  buildChart:
    name: "Regenerate the chart via charts-build-scripts"
    kind: shell
    scmid: "default"
    disablesourceinput: true
    dependson:
      - "packageURL"
      - "packageBuildVersion"
    spec:
      command: "make prepare PACKAGE=online-boutique && make patch PACKAGE=online-boutique && make charts PACKAGE=online-boutique && make clean PACKAGE=online-boutique"

actions:
  default:
    kind: "github/pullrequest"
    scmid: "default"
    spec:
      title: 'chore(online-boutique): bump chart to {{ source "lastRelease" }}'
      description: |
        Automated upstream sync via [updatecli](https://www.updatecli.io/).

        Pulls in `online-boutique` `{{ source "lastRelease" }}` and
        regenerates the chart via `make prepare`, `make patch` and `make
        charts`. Review the diff under `packages/online-boutique/` as you
        would any other chart bump before merging.
      labels:
        - "dependencies"
        - "online-boutique"
