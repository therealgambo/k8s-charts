name: "Bump kargo chart to the latest upstream release"

scms:
  default:
    kind: github
    spec:
      owner: '{{ .github.owner }}'
      repository: '{{ .github.repository }}'
      branch: '{{ .github.branch }}'
      # Matches whoever GITHUB_TOKEN actually authenticates as (the
      # updatecli GitHub App in CI, or a human token for local runs) rather
      # than a hardcoded identity.
      user: '{{ requiredEnv "GITHUB_ACTOR" }}'
      email: '{{ requiredEnv "GITHUB_ACTOR" }}@users.noreply.github.com'
      username: "x-access-token"
      token: '{{ requiredEnv "GITHUB_TOKEN" }}'
      commitmessage:
        type: "chore"
        scope: "kargo"

# Unlike the other packages, kargo's chart isn't a GitHub release asset - it's
# published as an OCI artifact to ghcr.io/akuity/kargo-charts/kargo, tagged
# with the bare chart version (no "v" prefix). Query the registry directly
# for tags and pick the newest one that isn't a pre-release (-rc./-alpha.
# etc): semver constraint matching only considers pre-release tags when the
# constraint itself has a pre-release component, so ">=0.0.0" naturally
# selects the newest stable tag.
sources:
  lastRelease:
    name: "Get the latest kargo helm chart release"
    kind: dockerimage
    spec:
      image: "ghcr.io/akuity/kargo-charts/kargo"
      versionfilter:
        kind: "semver"
        pattern: ">=0.0.0"

conditions:
  chartTagPublished:
    name: "Check the release OCI tag is published"
    kind: dockerimage
    disablesourceinput: true
    spec:
      image: "ghcr.io/akuity/kargo-charts/kargo"
      tag: '{{ source "lastRelease" }}'

  # buildChart below always "succeeds with output" (make's own logging is
  # never empty), so updatecli can't tell from the shell target alone
  # whether a rebuild was actually necessary - it would run make on every
  # scheduled check and then error out with "no changed file to commit"
  # once nothing was left to stage. Gate the whole pipeline here instead:
  # skip cleanly, before any target runs, unless this release isn't already
  # applied. failwhen inverts the normal yaml-condition pass criteria
  # (equal = pass) into "equal = stop the pipeline here, cleanly".
  upstreamVersionChanged:
    name: "Only continue if this release isn't already applied"
    kind: yaml
    scmid: "default"
    disablesourceinput: true
    failwhen: true
    spec:
      file: "packages/kargo/package.yaml"
      key: "$.url"
      value: 'oci://ghcr.io/akuity/kargo-charts/kargo:{{ source "lastRelease" }}'

targets:
  packageURL:
    name: "Point packages/kargo/package.yaml at the new release tag"
    kind: yaml
    sourceid: "lastRelease"
    scmid: "default"
    spec:
      file: "packages/kargo/package.yaml"
      key: "$.url"
      value: 'oci://ghcr.io/akuity/kargo-charts/kargo:{{ source "lastRelease" }}'

  packageBuildVersion:
    name: "Reset packageVersion to 1 for the new upstream release"
    kind: yaml
    sourceid: "lastRelease"
    scmid: "default"
    spec:
      file: "packages/kargo/package.yaml"
      key: "$.packageVersion"
      # packageVersion is an int field in charts-build-scripts; a leading
      # zero (e.g. "01") gets written back quoted as a string by the yaml
      # target and fails strict unmarshalling. Use "1", not "01".
      value: "1"

  buildChart:
    name: "Regenerate the chart via charts-build-scripts"
    kind: shell
    scmid: "default"
    disablesourceinput: true
    dependson:
      - "packageURL"
      - "packageBuildVersion"
    spec:
      command: "make prepare PACKAGE=kargo && make patch PACKAGE=kargo && make charts PACKAGE=kargo && make clean PACKAGE=kargo"

actions:
  default:
    kind: "github/pullrequest"
    scmid: "default"
    spec:
      title: 'chore(kargo): bump chart to {{ source "lastRelease" }}'
      description: |
        Automated upstream sync via [updatecli](https://www.updatecli.io/).

        Pulls in `kargo` `{{ source "lastRelease" }}` and regenerates
        the chart via `make prepare`, `make patch` and `make charts`. Review
        the diff under `charts/`, `assets/` and `packages/kargo/` as
        you would any other chart bump before merging.
      labels:
        - "dependencies"
        - "kargo"
