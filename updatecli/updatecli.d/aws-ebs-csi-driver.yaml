{{ $pkg := dict "name" "aws-ebs-csi-driver" "owner" "kubernetes-sigs" "repo" "aws-ebs-csi-driver" "versionPattern" "^helm-chart-aws-ebs-csi-driver-\\d+\\.\\d+\\.\\d+$" "capturePattern" "^helm-chart-aws-ebs-csi-driver-(\\d+\\.\\d+\\.\\d+)$" "urlParts" (list "https://github.com/kubernetes-sigs/aws-ebs-csi-driver/releases/download/helm-chart-aws-ebs-csi-driver-" "/aws-ebs-csi-driver-" ".tgz") "github" .github }}
name: "Bump aws-ebs-csi-driver chart to the latest upstream release"
pipelineid: "{{ $pkg.name }}"
scms:
  default:{{ template "common.scm" $pkg }}

sources:
  lastRelease:{{ template "githubrelease.source" $pkg }}

conditions:
  chartAssetPublished:{{ template "githubrelease.condition" $pkg }}
  upstreamVersionChanged:{{ template "githubrelease.upstreamVersionChanged" $pkg }}

targets:
  packageURL:{{ template "githubrelease.packageURL" $pkg }}
  packageBuildVersion:{{ template "common.packageBuildVersion" $pkg }}
  buildChart:{{ template "common.buildChart" $pkg }}

actions:
  default:{{ template "common.action" $pkg }}
