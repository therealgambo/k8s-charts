name: "Bump vertical-pod-autoscaler chart to the latest upstream release"

scms:
  default:
    kind: github
    spec:
      owner: '{{ .github.owner }}'
      repository: '{{ .github.repository }}'
      branch: '{{ .github.branch }}'
      # Matches whoever GITHUB_TOKEN actually authenticates as (the
      # updatecli GitHub App in CI, or a human token for local runs) rather
      # than a hardcoded identity.
      user: '{{ requiredEnv "GITHUB_ACTOR" }}'
      email: '{{ requiredEnv "GITHUB_ACTOR" }}@users.noreply.github.com'
      username: "x-access-token"
      token: '{{ requiredEnv "GITHUB_TOKEN" }}'
      commitmessage:
        type: "chore"
        scope: "vertical-pod-autoscaler"

# kubernetes/autoscaler tags each chart release
# "vertical-pod-autoscaler-chart-<version>" (that monorepo hosts the
# autoscaler components too). Filter to those and pull out the bare version.
sources:
  lastRelease:
    name: "Get the latest vertical-pod-autoscaler helm chart release"
    kind: githubrelease
    spec:
      owner: "kubernetes"
      repository: "autoscaler"
      token: '{{ requiredEnv "GITHUB_TOKEN" }}'
      versionfilter:
        kind: "regex"
        pattern: '^vertical-pod-autoscaler-chart-\d+\.\d+\.\d+$'
    transformers:
      - findsubmatch:
          pattern: '^vertical-pod-autoscaler-chart-(\d+\.\d+\.\d+)$'
          captureindex: 1

conditions:
  chartAssetPublished:
    name: "Check the release tgz asset is published"
    kind: shell
    disablesourceinput: true
    spec:
      command: >-
        curl --fail --silent --show-error --location --output /dev/null
        "https://github.com/kubernetes/autoscaler/releases/download/vertical-pod-autoscaler-chart-{{ source "lastRelease" }}/vertical-pod-autoscaler-{{ source "lastRelease" }}.tgz"

  # buildChart below always "succeeds with output" (make's own logging is
  # never empty), so updatecli can't tell from the shell target alone
  # whether a rebuild was actually necessary - it would run make on every
  # scheduled check and then error out with "no changed file to commit"
  # once nothing was left to stage. Gate the whole pipeline here instead:
  # skip cleanly, before any target runs, unless this release isn't already
  # applied. failwhen inverts the normal yaml-condition pass criteria
  # (equal = pass) into "equal = stop the pipeline here, cleanly".
  upstreamVersionChanged:
    name: "Only continue if this release isn't already applied"
    kind: yaml
    scmid: "default"
    disablesourceinput: true
    failwhen: true
    spec:
      file: "packages/vertical-pod-autoscaler/package.yaml"
      key: "$.url"
      value: 'https://github.com/kubernetes/autoscaler/releases/download/vertical-pod-autoscaler-chart-{{ source "lastRelease" }}/vertical-pod-autoscaler-{{ source "lastRelease" }}.tgz'

targets:
  packageURL:
    name: "Point packages/vertical-pod-autoscaler/package.yaml at the new release asset"
    kind: yaml
    sourceid: "lastRelease"
    scmid: "default"
    spec:
      file: "packages/vertical-pod-autoscaler/package.yaml"
      key: "$.url"
      value: 'https://github.com/kubernetes/autoscaler/releases/download/vertical-pod-autoscaler-chart-{{ source "lastRelease" }}/vertical-pod-autoscaler-{{ source "lastRelease" }}.tgz'

  packageBuildVersion:
    name: "Reset packageVersion to 01 for the new upstream release"
    kind: yaml
    sourceid: "lastRelease"
    scmid: "default"
    spec:
      file: "packages/vertical-pod-autoscaler/package.yaml"
      key: "$.packageVersion"
      engine: "yamlpath"
      value: "01"

  buildChart:
    name: "Regenerate the chart via charts-build-scripts"
    kind: shell
    scmid: "default"
    disablesourceinput: true
    dependson:
      - "packageURL"
      - "packageBuildVersion"
    spec:
      command: "make prepare PACKAGE=vertical-pod-autoscaler && make patch PACKAGE=vertical-pod-autoscaler && make charts PACKAGE=vertical-pod-autoscaler && make clean PACKAGE=vertical-pod-autoscaler"

actions:
  default:
    kind: "github/pullrequest"
    scmid: "default"
    spec:
      title: 'chore(vertical-pod-autoscaler): bump chart to {{ source "lastRelease" }}'
      description: |
        Automated upstream sync via [updatecli](https://www.updatecli.io/).

        Pulls in `vertical-pod-autoscaler` `{{ source "lastRelease" }}` and
        regenerates the chart via `make prepare`, `make patch` and `make
        charts`. Review the diff under `charts/`, `assets/` and
        `packages/vertical-pod-autoscaler/` as you would any other chart
        bump before merging.
      labels:
        - "dependencies"
        - "vertical-pod-autoscaler"
