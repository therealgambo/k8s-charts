name: "Bump argo-cd chart to the latest upstream release"

scms:
  default:
    kind: github
    spec:
      owner: '{{ .github.owner }}'
      repository: '{{ .github.repository }}'
      branch: '{{ .github.branch }}'
      # Matches whoever GITHUB_TOKEN actually authenticates as (the
      # updatecli GitHub App in CI, or a human token for local runs) rather
      # than a hardcoded identity.
      user: '{{ requiredEnv "GITHUB_ACTOR" }}'
      email: '{{ requiredEnv "GITHUB_ACTOR" }}@users.noreply.github.com'
      username: "x-access-token"
      token: '{{ requiredEnv "GITHUB_TOKEN" }}'
      commitmessage:
        type: "chore"
        scope: "argo-cd"

# argo-helm hosts multiple charts (argo-cd, argo-events, argo-rollouts, ...)
# and tags each release "<chart>-<version>". Filter to just argo-cd releases
# and pull out the bare version.
sources:
  lastRelease:
    name: "Get the latest argo-cd helm chart release"
    kind: githubrelease
    spec:
      owner: "argoproj"
      repository: "argo-helm"
      token: '{{ requiredEnv "GITHUB_TOKEN" }}'
      versionfilter:
        kind: "regex"
        pattern: '^argo-cd-\d+\.\d+\.\d+$'
    transformers:
      - findsubmatch:
          pattern: '^argo-cd-(\d+\.\d+\.\d+)$'
          captureindex: 1

conditions:
  chartAssetPublished:
    name: "Check the release tgz asset is published"
    kind: shell
    disablesourceinput: true
    spec:
      command: >-
        curl --fail --silent --show-error --location --output /dev/null
        "https://github.com/argoproj/argo-helm/releases/download/argo-cd-{{ source "lastRelease" }}/argo-cd-{{ source "lastRelease" }}.tgz"

  # buildChart below always "succeeds with output" (make's own logging is
  # never empty), so updatecli can't tell from the shell target alone
  # whether a rebuild was actually necessary - it would run make on every
  # scheduled check and then error out with "no changed file to commit"
  # once nothing was left to stage. Gate the whole pipeline here instead:
  # skip cleanly, before any target runs, unless this release isn't already
  # applied. failwhen inverts the normal yaml-condition pass criteria
  # (equal = pass) into "equal = stop the pipeline here, cleanly".
  upstreamVersionChanged:
    name: "Only continue if this release isn't already applied"
    kind: yaml
    scmid: "default"
    disablesourceinput: true
    failwhen: true
    spec:
      file: "packages/argo-cd/package.yaml"
      key: "$.url"
      value: 'https://github.com/argoproj/argo-helm/releases/download/argo-cd-{{ source "lastRelease" }}/argo-cd-{{ source "lastRelease" }}.tgz'

targets:
  packageURL:
    name: "Point packages/argo-cd/package.yaml at the new release asset"
    kind: yaml
    sourceid: "lastRelease"
    scmid: "default"
    spec:
      file: "packages/argo-cd/package.yaml"
      key: "$.url"
      value: 'https://github.com/argoproj/argo-helm/releases/download/argo-cd-{{ source "lastRelease" }}/argo-cd-{{ source "lastRelease" }}.tgz'

  packageBuildVersion:
    name: "Reset packageVersion to 01 for the new upstream release"
    kind: yaml
    sourceid: "lastRelease"
    scmid: "default"
    spec:
      file: "packages/argo-cd/package.yaml"
      key: "$.packageVersion"
      engine: "yamlpath"
      value: "01"

  buildChart:
    name: "Regenerate the chart via charts-build-scripts"
    kind: shell
    scmid: "default"
    disablesourceinput: true
    dependson:
      - "packageURL"
      - "packageBuildVersion"
    spec:
      command: "make prepare PACKAGE=argo-cd && make patch PACKAGE=argo-cd && make charts PACKAGE=argo-cd && make clean PACKAGE=argo-cd"

actions:
  default:
    kind: "github/pullrequest"
    scmid: "default"
    spec:
      title: 'chore(argo-cd): bump chart to {{ source "lastRelease" }}'
      description: |
        Automated upstream sync via [updatecli](https://www.updatecli.io/).

        Pulls in `argo-cd` `{{ source "lastRelease" }}` and regenerates
        the chart via `make prepare`, `make patch` and `make charts`. Review
        the diff under `packages/argo-cd/` as
        you would any other chart bump before merging.
      labels:
        - "dependencies"
        - "argo-cd"
