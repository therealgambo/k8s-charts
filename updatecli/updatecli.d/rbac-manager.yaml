name: "Bump rbac-manager chart to the latest upstream release"

scms:
  default:
    kind: github
    spec:
      owner: '{{ .github.owner }}'
      repository: '{{ .github.repository }}'
      branch: '{{ .github.branch }}'
      # Matches whoever GITHUB_TOKEN actually authenticates as (the
      # updatecli GitHub App in CI, or a human token for local runs) rather
      # than a hardcoded identity.
      user: '{{ requiredEnv "GITHUB_ACTOR" }}'
      email: '{{ requiredEnv "GITHUB_ACTOR" }}@users.noreply.github.com'
      username: "x-access-token"
      token: '{{ requiredEnv "GITHUB_TOKEN" }}'
      commitmessage:
        type: "chore"
        scope: "rbac-manager"

# rbac-manager isn't a GitHub release asset (FairwindsOps/rbac-manager tags
# releases by app version, e.g. "v1.10.0", which doesn't match the chart's
# own "2.0.0" versioning) or an OCI artifact - it's a classic Helm chart
# repository (index.yaml) served from charts.fairwinds.com. The helmchart
# source reads that index directly and (by default) picks the newest stable
# semver-published version.
sources:
  lastRelease:
    name: "Get the latest rbac-manager helm chart release"
    kind: helmchart
    spec:
      url: "https://charts.fairwinds.com/stable"
      name: "rbac-manager"

conditions:
  chartVersionPublished:
    name: "Check the release chart version is published"
    kind: helmchart
    disablesourceinput: true
    spec:
      url: "https://charts.fairwinds.com/stable"
      name: "rbac-manager"
      version: '{{ source "lastRelease" }}'

  # buildChart below always "succeeds with output" (make's own logging is
  # never empty), so updatecli can't tell from the shell target alone
  # whether a rebuild was actually necessary - it would run make on every
  # scheduled check and then error out with "no changed file to commit"
  # once nothing was left to stage. Gate the whole pipeline here instead:
  # skip cleanly, before any target runs, unless this release isn't already
  # applied. failwhen inverts the normal yaml-condition pass criteria
  # (equal = pass) into "equal = stop the pipeline here, cleanly".
  upstreamVersionChanged:
    name: "Only continue if this release isn't already applied"
    kind: yaml
    scmid: "default"
    disablesourceinput: true
    failwhen: true
    spec:
      file: "packages/rbac-manager/package.yaml"
      key: "$.url"
      value: 'https://charts.fairwinds.com/stable/rbac-manager-{{ source "lastRelease" }}.tgz'

targets:
  packageURL:
    name: "Point packages/rbac-manager/package.yaml at the new release asset"
    kind: yaml
    sourceid: "lastRelease"
    scmid: "default"
    spec:
      file: "packages/rbac-manager/package.yaml"
      key: "$.url"
      value: 'https://charts.fairwinds.com/stable/rbac-manager-{{ source "lastRelease" }}.tgz'

  packageBuildVersion:
    name: "Reset packageVersion to 1 for the new upstream release"
    kind: yaml
    sourceid: "lastRelease"
    scmid: "default"
    spec:
      file: "packages/rbac-manager/package.yaml"
      key: "$.packageVersion"
      # packageVersion is an int field in charts-build-scripts; a leading
      # zero (e.g. "01") gets written back quoted as a string by the yaml
      # target and fails strict unmarshalling. Use "1", not "01".
      value: "1"

  buildChart:
    name: "Regenerate the chart via charts-build-scripts"
    kind: shell
    scmid: "default"
    disablesourceinput: true
    dependson:
      - "packageURL"
      - "packageBuildVersion"
    spec:
      command: "make prepare PACKAGE=rbac-manager && make patch PACKAGE=rbac-manager && make charts PACKAGE=rbac-manager && make clean PACKAGE=rbac-manager"

actions:
  default:
    kind: "github/pullrequest"
    scmid: "default"
    spec:
      title: 'chore(rbac-manager): bump chart to {{ source "lastRelease" }}'
      description: |
        Automated upstream sync via [updatecli](https://www.updatecli.io/).

        Pulls in `rbac-manager` `{{ source "lastRelease" }}` and regenerates
        the chart via `make prepare`, `make patch` and `make charts`. Review
        the diff under `charts/`, `assets/` and `packages/rbac-manager/` as
        you would any other chart bump before merging.
      labels:
        - "dependencies"
        - "rbac-manager"
