{{/*
Hybrid shape: version is tracked via a GitHub release on the app repo (the
OCI registry it's actually published to doesn't tag independently), but
the published artifact itself is checked/referenced the same way as any
other OCI chart -- so this mixes githubrelease.source with the
dockerimage.* condition/target templates instead of introducing a new
family for what's otherwise a one-off.
*/}}
{{ $pkg := dict "name" "onlineboutique" "owner" "GoogleCloudPlatform" "repo" "microservices-demo" "versionPattern" "^v\\d+\\.\\d+\\.\\d+$" "capturePattern" "^v(\\d+\\.\\d+\\.\\d+)$" "sourceLabel" "microservices-demo" "releaseNoun" "release" "image" "us-docker.pkg.dev/online-boutique-ci/charts/onlineboutique" "github" .github }}
name: "Bump onlineboutique chart to the latest upstream release"

scms:
  default:{{ template "common.scm" $pkg }}

sources:
  lastRelease:{{ template "githubrelease.source" $pkg }}

conditions:
  chartTagPublished:{{ template "dockerimage.condition" $pkg }}
  upstreamVersionChanged:{{ template "dockerimage.upstreamVersionChanged" $pkg }}

targets:
  packageURL:{{ template "dockerimage.packageURL" $pkg }}
  packageBuildVersion:{{ template "common.packageBuildVersion" $pkg }}
  buildChart:{{ template "common.buildChart" $pkg }}

actions:
  default:{{ template "common.action" $pkg }}
