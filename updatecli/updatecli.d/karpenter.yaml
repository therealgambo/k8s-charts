name: "Bump karpenter chart to the latest upstream release"

scms:
  default:
    kind: github
    spec:
      owner: '{{ .github.owner }}'
      repository: '{{ .github.repository }}'
      branch: '{{ .github.branch }}'
      # Matches whoever GITHUB_TOKEN actually authenticates as (the
      # updatecli GitHub App in CI, or a human token for local runs) rather
      # than a hardcoded identity.
      user: '{{ requiredEnv "GITHUB_ACTOR" }}'
      email: '{{ requiredEnv "GITHUB_ACTOR" }}@users.noreply.github.com'
      username: "x-access-token"
      token: '{{ requiredEnv "GITHUB_TOKEN" }}'
      commitmessage:
        type: "chore"
        scope: "karpenter"

# karpenter's chart isn't a GitHub release asset - it's published as an OCI
# artifact to public.ecr.aws/karpenter/karpenter. That registry is also full
# of non-release tags: nightly builds tagged "v0-<commit-sha>", date-stamped
# tags like "20221219", and "sha256-....sig" cosign signatures. Without a
# tagfilter, a bare date tag parses as a (huge, invalid) semver major and
# wins over any real release under a ">=0.0.0" constraint - the tagfilter is
# load-bearing here, not just tidiness. Older releases (pre-0.35.0) are
# tagged "vX.Y.Z"; everything since drops the "v" - the filter accepts both,
# and semver constraint matching only considers pre-release tags when the
# constraint itself has a pre-release component, so ">=0.0.0" naturally
# selects the newest stable tag either way.
sources:
  lastRelease:
    name: "Get the latest karpenter helm chart release"
    kind: dockerimage
    spec:
      image: "public.ecr.aws/karpenter/karpenter"
      tagfilter: '^v?\d+\.\d+\.\d+$'
      versionfilter:
        kind: "semver"
        pattern: ">=0.0.0"

conditions:
  chartTagPublished:
    name: "Check the release OCI tag is published"
    kind: dockerimage
    disablesourceinput: true
    spec:
      image: "public.ecr.aws/karpenter/karpenter"
      tag: '{{ source "lastRelease" }}'

  # buildChart below always "succeeds with output" (make's own logging is
  # never empty), so updatecli can't tell from the shell target alone
  # whether a rebuild was actually necessary - it would run make on every
  # scheduled check and then error out with "no changed file to commit"
  # once nothing was left to stage. Gate the whole pipeline here instead:
  # skip cleanly, before any target runs, unless this release isn't already
  # applied. failwhen inverts the normal yaml-condition pass criteria
  # (equal = pass) into "equal = stop the pipeline here, cleanly".
  upstreamVersionChanged:
    name: "Only continue if this release isn't already applied"
    kind: yaml
    scmid: "default"
    disablesourceinput: true
    failwhen: true
    spec:
      file: "packages/karpenter/package.yaml"
      key: "$.url"
      value: 'oci://public.ecr.aws/karpenter/karpenter:{{ source "lastRelease" }}'

targets:
  packageURL:
    name: "Point packages/karpenter/package.yaml at the new release tag"
    kind: yaml
    sourceid: "lastRelease"
    scmid: "default"
    spec:
      file: "packages/karpenter/package.yaml"
      key: "$.url"
      value: 'oci://public.ecr.aws/karpenter/karpenter:{{ source "lastRelease" }}'

  packageBuildVersion:
    name: "Reset packageVersion to 01 for the new upstream release"
    kind: yaml
    sourceid: "lastRelease"
    scmid: "default"
    spec:
      file: "packages/karpenter/package.yaml"
      key: "$.packageVersion"
      engine: "yamlpath"
      value: "01"

  buildChart:
    name: "Regenerate the chart via charts-build-scripts"
    kind: shell
    scmid: "default"
    disablesourceinput: true
    dependson:
      - "packageURL"
      - "packageBuildVersion"
    spec:
      command: "make prepare PACKAGE=karpenter && make patch PACKAGE=karpenter && make charts PACKAGE=karpenter && make clean PACKAGE=karpenter"

actions:
  default:
    kind: "github/pullrequest"
    scmid: "default"
    spec:
      title: 'chore(karpenter): bump chart to {{ source "lastRelease" }}'
      description: |
        Automated upstream sync via [updatecli](https://www.updatecli.io/).

        Pulls in `karpenter` `{{ source "lastRelease" }}` and regenerates
        the chart via `make prepare`, `make patch` and `make charts`. Review
        the diff under `charts/`, `assets/` and `packages/karpenter/` as
        you would any other chart bump before merging.
      labels:
        - "dependencies"
        - "karpenter"
