name: Release charts

# Builds every package changed by a push to main (make prepare + make
# charts) and pushes each resulting chart archive to GHCR as an OCI
# artifact: oci://ghcr.io/<owner>/<repo>/<chart-name>:<version>.
on:
  push:
    branches: ["main"]
    paths:
      - "packages/**"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Scopes the release job to only the packages this push actually touched,
  # same approach as validate-charts.yaml. workflow_dispatch has no
  # before/after to diff against (and neither does the first push after this
  # workflow is added), so both fall back to releasing every package.
  detect-packages:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: detect
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            list="$(./scripts/changed-packages.sh "${{ github.event.before }}" "${{ github.sha }}")"
          else
            list="$(./scripts/changed-packages.sh --all)"
          fi
          packages="$(jq -R -s -c 'split("\n") | map(select(length > 0))' <<< "${list}")"
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"
          echo "Packages to release: ${packages}"

  release:
    name: release (${{ matrix.package }})
    needs: detect-packages
    if: needs.detect-packages.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-packages.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve pinned helm version
        run: |
          source scripts/version
          echo "HELM_VERSION=${HELM_VERSION}" >> "$GITHUB_ENV"

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: make prepare
        run: make prepare PACKAGE=${{ matrix.package }}

      - name: make charts
        run: make charts PACKAGE=${{ matrix.package }}

      - name: Push to GHCR
        run: |
          repo_lower="$(tr '[:upper:]' '[:lower:]' <<< '${{ github.repository }}')"
          shopt -s nullglob
          archives=(assets/${{ matrix.package }}/*.tgz)

          if [[ "${#archives[@]}" -eq 0 ]]; then
            echo "::error::no archive produced for ${{ matrix.package }}"
            exit 1
          fi

          for archive in "${archives[@]}"; do
            echo "pushing ${archive} to oci://ghcr.io/${repo_lower}"
            helm push "${archive}" "oci://ghcr.io/${repo_lower}"
          done
