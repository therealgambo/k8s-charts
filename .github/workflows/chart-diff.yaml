name: Dyff

# Renders every package a PR touches from both the base branch and the PR
# branch, diffs the two manifests with dyff, and publishes the result as a
# single sticky comment on the PR (updated in place on subsequent pushes).
#
# Note: for PRs opened from a fork, the default GITHUB_TOKEN is read-only
# regardless of the `permissions` block below, so the comment step is
# expected to fail there unless the repo allows write tokens for fork PRs.
on:
  pull_request:
    branches: ["main"]
    paths:
      - "packages/**"
      - "scripts/changed-packages.sh"
      - "scripts/pull-dyff.sh"
      - "scripts/version"
      - "Makefile"
      - ".github/workflows/chart-diff.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Scopes rendering to only the packages this PR actually touches, same as
  # validate-charts.yaml.
  detect-packages:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: detect
        run: |
          set -euo pipefail
          # See validate-charts.yaml's detect-packages step: base.sha can go
          # stale relative to the base branch's current tip, so recompute a
          # fresh merge-base instead of trusting the event payload.
          base="$(git merge-base "origin/${{ github.event.pull_request.base.ref }}" "${{ github.sha }}")"
          list="$(./scripts/changed-packages.sh "${base}" "${{ github.sha }}")"
          packages="$(jq -R -s -c 'split("\n") | map(select(length > 0))' <<< "${list}")"
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"
          echo "Packages to diff: ${packages}"

  # Renders each changed package from both branches and uploads a markdown
  # fragment with the dyff result. Matrix jobs can't feed a single comment
  # directly, so the fragments are stitched together by the comment job.
  render-diff:
    name: render (${{ matrix.package }})
    needs: detect-packages
    if: needs.detect-packages.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-packages.outputs.packages) }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: main

      - name: Resolve pinned helm version
        run: |
          source pr/scripts/version
          echo "HELM_VERSION=${HELM_VERSION}" >> "$GITHUB_ENV"

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install dyff
        run: pr/scripts/pull-dyff.sh

      # Both sides render with the same helm/dyff versions (pinned by the PR
      # branch) so any diff reflects the chart change, not the tooling.
      #
      # --no-print-directory matters here: GNU Make prints "Entering/Leaving
      # directory" notices to stdout whenever -C is used (from make 4.x on —
      # notably including ubuntu-latest's runner image; macOS's ancient
      # bundled make 3.81 does not, which makes this invisible when testing
      # locally on a Mac). Without the flag, those notices land inside the
      # redirected manifest file: a bogus leading YAML document with no
      # apiVersion/kind, and stray text spliced onto the last resource. dyff
      # then can't identify every resource on both sides and refuses to
      # compare manifests with a different number of documents.
      - name: Render PR-branch manifest
        id: render_pr
        run: |
          if make --no-print-directory -C pr prepare PACKAGE="${{ matrix.package }}" \
              && make --no-print-directory -C pr template PACKAGE="${{ matrix.package }}" \
                  > pr-manifest.yaml 2> pr-render.log; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      # A package that doesn't exist on the base branch yet (newly added in
      # this PR) diffs against an empty manifest, so dyff reports the whole
      # rendered chart as additions instead of the job failing outright.
      - name: Render base-branch manifest
        id: render_base
        run: |
          if [[ ! -f "main/packages/${{ matrix.package }}/package.yaml" ]]; then
            echo "Package does not exist on the base branch yet — diffing against an empty manifest."
            : > base-manifest.yaml
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if make --no-print-directory -C main prepare PACKAGE="${{ matrix.package }}" \
              && make --no-print-directory -C main template PACKAGE="${{ matrix.package }}" \
                  > base-manifest.yaml 2> base-render.log; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      # Note: a chart that uses Helm's `required` on a value with no default
      # (e.g. karpenter's settings.clusterName) fails `helm template` on
      # both sides with no values supplied — same known gap noted in
      # validate-charts.yaml. The step below still builds a comment fragment
      # describing the render failure, but then fails the job (this workflow
      # isn't a required check, so it's visible without blocking merges —
      # kubeconform in validate-charts.yaml is the enforced gate for this).
      #
      # Separately, dyff can fail to compare two manifests that both
      # rendered fine. Its Kubernetes-aware mode (matching resources by
      # apiVersion/kind/name instead of document position, so it can handle
      # a different number of documents on each side) quietly disables
      # itself if it can't identify every single resource on both sides —
      # then it hard-errors on any document-count mismatch. A values change
      # that adds/removes resources (e.g. enabling cilium's
      # ingressController) can trigger exactly that. `-s`/--set-exit-code
      # makes dyff report this distinctly (exit 255, vs. 0/1 for no-diff/
      # diff-found), so it's handled below the same way as a render
      # failure, instead of being swallowed and misreported as "no changes".
      - name: Diff with dyff
        run: |
          mkdir -p diff-output
          out="diff-output/${{ matrix.package }}.md"
          render_failed=0
          if [[ "${{ steps.render_base.outputs.ok }}" != "true" || "${{ steps.render_pr.outputs.ok }}" != "true" ]]; then
            echo "::error::${{ matrix.package }} failed to render — see the chart diff PR comment for details. This job fails but isn't a required check, so it doesn't block merging by itself; kubeconform in the Validate workflow is the enforced gate."
            render_failed=1
          fi

          dyff_failed=0
          if [[ "${render_failed}" -eq 0 ]]; then
            set +e
            diff="$(pr/bin/dyff between -s -i -b -c off --exclude-regexp '/labels/helm\.sh/chart$' --exclude-regexp '/labels/app\.kubernetes\.io/version$' base-manifest.yaml pr-manifest.yaml 2>dyff-error.log)"
            dyff_exit=$?
            set -e
            if [[ "${dyff_exit}" -ne 0 && "${dyff_exit}" -ne 1 ]]; then
              echo "::error::${{ matrix.package }} rendered on both branches, but dyff failed to compare the manifests — see the chart diff PR comment for details. This job fails but isn't a required check, so it doesn't block merging by itself; kubeconform in the Validate workflow is the enforced gate."
              dyff_failed=1
            fi
          fi

          {
            echo "<details>"
            if [[ "${{ steps.render_base.outputs.ok }}" != "true" || "${{ steps.render_pr.outputs.ok }}" != "true" ]]; then
              echo "<summary>⚠️ <strong>${{ matrix.package }}</strong> — could not render one or both manifests</summary>"
              echo
              echo '```'
              [[ -s base-render.log ]] && { echo "-- base branch --"; cat base-render.log; }
              [[ -s pr-render.log ]] && { echo "-- PR branch --"; cat pr-render.log; }
              echo '```'
            elif [[ "${dyff_failed}" -eq 1 ]]; then
              echo "<summary>⚠️ <strong>${{ matrix.package }}</strong> — both manifests rendered, but dyff failed to compare them</summary>"
              echo
              echo '```'
              [[ -s dyff-error.log ]] && cat dyff-error.log
              echo '```'
            elif [[ -z "${diff}" ]]; then
              echo "<summary>:package: <strong>${{ matrix.package }}</strong> — no changes to the rendered manifest</summary>"
            else
              echo "<summary>:package: <strong>${{ matrix.package }}</strong> — rendered manifest changed</summary>"
              echo
              echo '```diff'
              echo "${diff}"
              echo '```'
            fi
            echo
            echo "</details>"
          } > "${out}"

          if [[ "${render_failed}" -eq 1 || "${dyff_failed}" -eq 1 ]]; then
            exit 1
          fi

      # if: always() so the fragment still gets uploaded (and the PR
      # comment still shows the render error) even though the step above
      # now exits 1 on a render failure.
      - name: Upload diff fragment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chart-diff-${{ matrix.package }}
          path: diff-output/${{ matrix.package }}.md
          retention-days: 1

  comment:
    name: Publish PR comment
    needs: [detect-packages, render-diff]
    if: always() && needs.detect-packages.outputs.packages != '[]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download diff fragments
        uses: actions/download-artifact@v4
        with:
          pattern: chart-diff-*
          path: diff-output
          merge-multiple: true

      - name: Build comment body
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "<!-- chart-diff-comment -->"
            echo "### Chart diff"
            echo
            echo "Rendered manifest diff (\`helm template\` + [dyff](https://github.com/homeport/dyff)) between this PR and \`main\` for each changed package."
            echo
            for f in $(printf '%s\n' diff-output/*.md | sort); do
              cat "${f}"
              echo
            done
          } > comment-body.md

          # Stay under GitHub's ~65536 character comment limit.
          max_bytes=60000
          if [[ "$(wc -c < comment-body.md)" -gt "${max_bytes}" ]]; then
            {
              head -c "${max_bytes}" comment-body.md
              echo
              echo '```'
              echo
              echo "**⚠️ Diff truncated — output exceeded the size limit for a single PR comment. See this workflow run's logs/artifacts for the full diff.**"
            } > comment-body.truncated.md
            mv comment-body.truncated.md comment-body.md
          fi

          # Footer added after the truncation check so it's never cut off —
          # it's how reviewers tell whether the comment reflects the latest
          # push without having to scroll up and match SHAs themselves.
          {
            echo
            echo "---"
            echo "_Updated for commit [\`${HEAD_SHA:0:7}\`](${COMMIT_URL}) at $(date -u +'%Y-%m-%d %H:%M:%S UTC')._"
          } >> comment-body.md

      - name: Create or update comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment-body.md', 'utf8');
            const marker = '<!-- chart-diff-comment -->';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
