name: PR chart

# Builds every package a PR touches and pushes it to a *separate* GHCR
# package tree — oci://ghcr.io/<owner>/test-pr/<chart-name> — under a
# mutable tag derived from the PR number (0.0.0-pr<N>). Re-pushing on later
# commits to the same PR overwrites that one tag, so consumers can always
# `helm pull` the latest state of a PR's chart for isolated testing.
#
# This is deliberately a different OCI repo than release-charts.yaml
# publishes to (k8s-charts vs test-pr): production tags are always
# real upstream versions and can never collide with 0.0.0-pr*, but keeping
# PR builds in their own package tree means they can have their own
# visibility/retention settings and never show up next to a production
# release even by accident.
on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]
    paths:
      - "packages/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Scopes the build to only the packages this PR actually touches, same
  # approach as validate-charts.yaml/chart-diff.yaml.
  detect-packages:
    uses: ./.github/workflows/_detect-changed-packages.yaml

  build-and-push:
    name: build-and-push (${{ matrix.package }})
    needs: detect-packages
    # PRs from forks get a read-only GITHUB_TOKEN regardless of the
    # `permissions` block above (same limitation chart-diff.yaml's comment
    # step already documents), so pushing to GHCR would just fail at
    # `helm registry login`. Skip cleanly instead of failing noisily —
    # a maintainer can push a same-repo branch/PR to get a PR chart built.
    if: needs.detect-packages.outputs.packages != '[]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-packages.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pinned helm
        uses: ./.github/actions/setup-pinned-helm

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: make prepare
        run: make prepare PACKAGE=${{ matrix.package }}

      - name: make charts
        run: make charts PACKAGE=${{ matrix.package }}

      - name: Compute PR-scoped version and OCI repo
        id: vars
        run: |
          owner_lower="$(cut -d/ -f1 <<< '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "pr_version=0.0.0-pr${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          echo "pr_repo=oci://ghcr.io/${owner_lower}/test-pr" >> "$GITHUB_OUTPUT"

      # helm push derives the OCI tag from the chart's own Chart.yaml
      # version, so a mutable PR-scoped tag means repackaging the built
      # archive with `helm package --version` overriding just that field —
      # the rendered content is identical to what release-charts.yaml would
      # ship, only the version metadata (and therefore the tag) differs.
      - name: Repackage with PR-scoped version and push to GHCR
        run: |
          set -euo pipefail
          pr_version="${{ steps.vars.outputs.pr_version }}"
          pr_repo="${{ steps.vars.outputs.pr_repo }}"

          shopt -s nullglob
          archives=(assets/${{ matrix.package }}/*.tgz)
          if [[ "${#archives[@]}" -eq 0 ]]; then
            echo "::error::no archive produced for ${{ matrix.package }}"
            exit 1
          fi

          mkdir -p pr-chart-refs
          for archive in "${archives[@]}"; do
            workdir="$(mktemp -d)"
            outdir="$(mktemp -d)"
            tar -xzf "${archive}" -C "${workdir}"
            chart_dir="$(find "${workdir}" -mindepth 1 -maxdepth 1 -type d)"
            chart_name="$(basename "${chart_dir}")"

            helm package "${chart_dir}" --version "${pr_version}" -d "${outdir}"
            repackaged="$(find "${outdir}" -maxdepth 1 -name '*.tgz')"

            echo "pushing ${repackaged} (from ${archive}) to ${pr_repo} as ${pr_version}"
            helm push "${repackaged}" "${pr_repo}"

            echo "\`${chart_name}\`: \`helm pull ${pr_repo}/${chart_name} --version ${pr_version}\`" \
              >> "pr-chart-refs/${{ matrix.package }}-${chart_name}.txt"

            rm -rf "${workdir}" "${outdir}"
          done

      - name: Upload pull-command fragment
        uses: actions/upload-artifact@v4
        with:
          name: pr-chart-ref-${{ matrix.package }}
          path: pr-chart-refs/*.txt
          retention-days: 1

  comment:
    name: Publish PR comment
    needs: [detect-packages, build-and-push]
    if: needs.detect-packages.outputs.packages != '[]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download pull-command fragments
        uses: actions/download-artifact@v4
        with:
          pattern: pr-chart-ref-*
          path: pr-chart-refs
          merge-multiple: true

      - name: Build comment body
        run: |
          {
            echo "<!-- pr-chart-comment -->"
            echo "### PR chart(s) published"
            echo
            echo "Mutable chart build(s) for this PR, pushed to a separate GHCR package tree (never overlaps with production releases in \`k8s-charts\`). Re-pushed on every commit — always pulls the latest state of this PR. Deleted automatically when the PR closes."
            echo
            for f in $(printf '%s\n' pr-chart-refs/*.txt | sort); do
              [[ -f "${f}" ]] && cat "${f}"
            done
          } > comment-body.md

      - name: Create or update comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment-body.md', 'utf8');
            const marker = '<!-- pr-chart-comment -->';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
