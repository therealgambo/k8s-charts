name: Clean up PR charts

# Deletes the mutable 0.0.0-pr<N> chart version(s) pr-chart.yaml published
# for a PR, once that PR's merge lands on main.
#
# Deliberately triggered by `push` to main, not `pull_request: closed`. For
# a pull_request-triggered workflow, GitHub loads the workflow *file itself*
# from the PR's merge ref — not just the code it checks out — and that's
# true for same-repo PRs too, not only forks (the fork restriction only
# withholds secrets, it doesn't change where the workflow definition comes
# from). So anyone able to open a same-repo PR could edit this file to
# exfiltrate PACKAGES_DELETE_TOKEN and have it take effect the moment their
# own PR closes, before any review. A `push` trigger doesn't have this
# problem: the workflow file that runs is always whatever's already
# committed to main.
#
# main's history alone doesn't say which PR a commit came from, so this
# looks it up via GitHub's own commit<->PR association
# (repos/{owner}/{repo}/commits/{sha}/pulls) for every commit the push
# introduced (a push event lists at most 20 commits — see GitHub's push
# event payload docs — which covers any realistic merge here), then scopes
# deletion to whichever packages that PR's file list touched.
#
# Token use: GITHUB_TOKEN handles the repo-scoped calls (commit<->PR
# association, PR file lists). Every GHCR *packages* REST call (listing
# versions, deleting one) uses PACKAGES_DELETE_TOKEN instead — GITHUB_TOKEN
# isn't just under-scoped for those on a personal-account-owned repo, it's
# the wrong token type entirely and GitHub rejects it outright (HTTP 400,
# not a scope-related 403).
#
# Known gap: this only fires on an actual merge to main. A PR closed
# *without* merging produces no push event, so its chart isn't cleaned up
# here — that's what pr-chart-sweep.yaml's daily reconciliation is for.
on:
  push:
    branches: ["main"]
    paths:
      - "packages/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read
  packages: read

concurrency:
  group: pr-chart-cleanup-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Resolves the merged PR(s) behind this push (a squash/merge-commit push
  # is normally one PR; a batch of rebase-merged commits, or a push
  # covering more than one merge, can be several) and, for each, the
  # packages/<name> directories its file list touched. Flattens to two
  # outputs: `targets` (pr+package pairs, for the delete matrix below) and
  # `prs` (unique PR numbers, for the PR-comment update).
  detect-prs:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.detect.outputs.targets }}
      prs: ${{ steps.detect.outputs.prs }}
    steps:
      - name: Resolve merged PR(s) for this push and the packages they touched
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mapfile -t commit_shas < <(jq -r '.[]' <<< '${{ toJSON(github.event.commits.*.id) }}')
          if [[ "${#commit_shas[@]}" -eq 0 ]]; then
            commit_shas=("${{ github.sha }}")
          fi

          declare -A seen_prs=()
          pr_numbers=()
          for sha in "${commit_shas[@]}"; do
            mapfile -t numbers < <(
              gh api "repos/${{ github.repository }}/commits/${sha}/pulls" --jq '.[] | select(.merged_at != null) | .number' 2>/dev/null || true
            )
            for n in "${numbers[@]}"; do
              [[ -n "${seen_prs[${n}]:-}" ]] && continue
              seen_prs[${n}]=1
              pr_numbers+=("${n}")
            done
          done

          targets="[]"
          prs="[]"
          for pr in "${pr_numbers[@]}"; do
            prs="$(jq --argjson pr "${pr}" '. + [$pr]' <<< "${prs}")"
            files="$(gh api "repos/${{ github.repository }}/pulls/${pr}/files" --paginate --jq '.[].filename')"
            mapfile -t packages < <(awk -F/ '/^packages\// { print $2 }' <<< "${files}" | sort -u)
            for pkg in "${packages[@]}"; do
              [[ -z "${pkg}" ]] && continue
              targets="$(jq --argjson pr "${pr}" --arg pkg "${pkg}" '. + [{pr: $pr, package: $pkg}]' <<< "${targets}")"
            done
          done

          echo "targets=$(jq -c . <<< "${targets}")" >> "$GITHUB_OUTPUT"
          echo "prs=$(jq -c . <<< "${prs}")" >> "$GITHUB_OUTPUT"
          echo "PR chart(s) to clean up: $(jq -c . <<< "${targets}")"

  cleanup:
    name: cleanup (pr-${{ matrix.target.pr }}, ${{ matrix.target.package }})
    needs: detect-prs
    if: needs.detect-prs.outputs.targets != '[]'
    runs-on: ubuntu-latest
    # Scopes PACKAGES_DELETE_TOKEN to the "main" environment. Its deployment
    # branch policy (restricted to "main") is a no-op today — push events
    # already only ever run this job from main's committed workflow file —
    # but it's a guardrail against ever wiring this secret into a future
    # pull_request-triggered job: a pull_request ref (refs/pull/<N>/merge)
    # can never satisfy a "main"-only policy, so that job would just be
    # blocked outright rather than silently getting the token.
    environment: main
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.detect-prs.outputs.targets) }}
    steps:
      - name: Delete PR chart version from GHCR
        # Both calls below hit the GHCR packages REST API (list versions,
        # delete a version) — on a personal-account-owned repo that API
        # rejects GITHUB_TOKEN outright (wrong token type, not just under-
        # scoped), so PACKAGES_DELETE_TOKEN is the only token this step uses.
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_DELETE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::PACKAGES_DELETE_TOKEN secret is not set — see the 'PR charts' section of the README for one-time setup."
            exit 1
          fi

          owner="$(cut -d/ -f1 <<< '${{ github.repository }}')"
          pr_version="0.0.0-pr${{ matrix.target.pr }}"
          package_name="test-pr/${{ matrix.target.package }}"
          encoded="$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "${package_name}")"

          if ! versions_json="$(gh api "users/${owner}/packages/container/${encoded}/versions?per_page=100" --paginate 2>&1)"; then
            if grep -qi '404' <<< "${versions_json}"; then
              echo "package ${package_name} not found — nothing to clean up"
              exit 0
            fi
            echo "::error::failed to list versions for ${package_name}: ${versions_json}"
            exit 1
          fi

          mapfile -t version_ids < <(jq -r --arg tag "${pr_version}" '.[] | select(.metadata.container.tags[]? == $tag) | .id' <<< "${versions_json}")

          if [[ "${#version_ids[@]}" -eq 0 ]]; then
            echo "no ${package_name}:${pr_version} version found — nothing to clean up"
            exit 0
          fi

          # GHCR refuses to DELETE a version if doing so would leave the
          # package with zero tagged versions ("You cannot delete the last
          # tagged version of a package. You must delete the package
          # instead.", HTTP 400) — and since each PR chart normally is the
          # package's only tagged version, that's the common case here, not
          # an edge case. Detect it up front: if the versions we're about to
          # delete account for every currently-tagged version in the
          # package, delete the package itself instead of looping.
          mapfile -t all_tagged_ids < <(jq -r '.[] | select((.metadata.container.tags // []) | length > 0) | .id' <<< "${versions_json}")

          if [[ "${#version_ids[@]}" -eq "${#all_tagged_ids[@]}" ]]; then
            echo "${package_name}:${pr_version} is the last tagged version — deleting the package instead"
            if ! out="$(gh api --method DELETE "users/${owner}/packages/container/${encoded}" 2>&1)"; then
              if grep -qi '404' <<< "${out}"; then
                echo "${package_name} already gone"
              else
                echo "::error::failed to delete package ${package_name}: ${out}"
                exit 1
              fi
            fi
            exit 0
          fi

          for version_id in "${version_ids[@]}"; do
            echo "deleting ${package_name}:${pr_version} (version id ${version_id})"
            gh api --method DELETE "users/${owner}/packages/container/${encoded}/versions/${version_id}"
          done

          # Other still-open PRs left tagged versions behind in the same
          # package (handled above when they didn't), so only remove the
          # package itself once nothing's left — per_page=1 is enough to
          # answer "any versions remain at all".
          remaining="$(gh api "users/${owner}/packages/container/${encoded}/versions?per_page=1" --jq 'length' 2>/dev/null || echo "unknown")"
          if [[ "${remaining}" == "0" ]]; then
            echo "${package_name} has no versions left — deleting the package"
            if ! out="$(gh api --method DELETE "users/${owner}/packages/container/${encoded}" 2>&1)"; then
              if grep -qi '404' <<< "${out}"; then
                echo "${package_name} already gone"
              else
                echo "::error::failed to delete empty package ${package_name}: ${out}"
                exit 1
              fi
            fi
          fi

  comment:
    name: Update PR comment (pr-${{ matrix.pr }})
    needs: [detect-prs, cleanup]
    if: always() && needs.detect-prs.outputs.prs != '[]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.detect-prs.outputs.prs) }}
    steps:
      - name: Note cleanup on the PR chart comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-chart-comment -->';
            const issue_number = ${{ matrix.pr }};
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (!existing) return;

            const body = existing.body + '\n\n---\n🧹 Chart(s) removed from `test-pr` after merge.';
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
