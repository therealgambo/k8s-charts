name: Validate

on:
  pull_request:
    branches: ["main"]
    paths:
      - "packages/**"
      - "scripts/changed-packages.sh"
      - "scripts/pull-kubeconform.sh"
      - "scripts/pull-kyverno.sh"
      - "scripts/pull-crane.sh"
      - "scripts/kyverno-policy-check.sh"
      - "scripts/check-image-availability.sh"
      - "scripts/check-package-version-bump.sh"
      - "scripts/version"
      - "Makefile"
      - ".github/workflows/validate-charts.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Scopes the two validation jobs below to only the packages a PR actually
  # touches. workflow_dispatch has no base ref to diff against, so it falls
  # back to validating every tracked package.
  detect-packages:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
      # Only meaningful for pull_request (see below) -- the merge-base package-version-bump
      # diffs each changed package's package.yaml/generated-changes against. Empty on
      # workflow_dispatch, which has no PR to diff against.
      base_sha: ${{ steps.detect.outputs.base_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: detect
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # github.event.pull_request.base.sha is frozen at the PR's last
            # sync and goes stale as soon as unrelated commits land on the
            # base branch afterwards -- diffing against it then pulls in
            # every intervening change too, not just this PR's own. Diff
            # from the merge-base with the base branch's *current* tip
            # instead, so only packages this PR actually touches show up.
            base="$(git merge-base "origin/${{ github.event.pull_request.base.ref }}" "${{ github.sha }}")"
            list="$(./scripts/changed-packages.sh "${base}" "${{ github.sha }}")"
            echo "base_sha=${base}" >> "$GITHUB_OUTPUT"
          else
            list="$(./scripts/changed-packages.sh --all)"
            echo "base_sha=" >> "$GITHUB_OUTPUT"
          fi
          packages="$(jq -R -s -c 'split("\n") | map(select(length > 0))' <<< "${list}")"
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"
          echo "Packages to validate: ${packages}"

  # Enforces the packageVersion convention from packages/README.md: it resets to 01 when a
  # package's upstream url/commit changes, and otherwise strictly increases whenever anything
  # else about the package changes (a hand-edited generated-changes/ patch, a values-file tweak,
  # ...) so two different patch sets never publish under the same chart version. See
  # scripts/check-package-version-bump.sh for the full rule and its known gaps.
  #
  # PR-only: this is fundamentally a diff against a base, which workflow_dispatch doesn't have.
  package-version-bump:
    name: packageVersion bump (${{ matrix.package }})
    needs: detect-packages
    if: github.event_name == 'pull_request' && needs.detect-packages.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-packages.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check packageVersion
        run: ./scripts/check-package-version-bump.sh "${{ needs.detect-packages.outputs.base_sha }}" "${{ matrix.package }}" "${{ github.sha }}"

  # Structural validation: catches broken YAML/Go-template syntax in a
  # patched chart. Deliberately not --strict — that also fails on cosmetic
  # upstream nits (e.g. a non-SemVer Chart.yaml version) unrelated to
  # whether the patch itself is legitimate.
  helm-lint:
    name: helm lint (${{ matrix.package }})
    needs: detect-packages
    if: needs.detect-packages.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-packages.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve pinned helm version
        run: |
          source scripts/version
          echo "HELM_VERSION=${HELM_VERSION}" >> "$GITHUB_ENV"

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: make prepare
        run: make prepare PACKAGE=${{ matrix.package }}

      - name: helm lint
        run: helm lint "$(./scripts/chart-dir.sh ${{ matrix.package }})"

  # Renders the chart and validates every resource against upstream
  # Kubernetes schemas (plus the CRDs-catalog for common CRDs, e.g.
  # cert-manager/argo-cd resources) to catch manifests that are well-formed
  # YAML but not valid Kubernetes objects.
  #
  # Note: charts that use `required` on a value with no default (e.g.
  # karpenter's settings.clusterName) fail `helm template` with no values
  # set. That's a known gap, not a bug in this workflow.
  kubeconform:
    name: kubeconform (${{ matrix.package }})
    needs: detect-packages
    if: needs.detect-packages.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-packages.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve pinned helm version
        run: |
          source scripts/version
          echo "HELM_VERSION=${HELM_VERSION}" >> "$GITHUB_ENV"

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: make prepare
        run: make prepare PACKAGE=${{ matrix.package }}

      - name: Install kubeconform
        run: ./scripts/pull-kubeconform.sh

      - name: helm template | kubeconform
        run: |
          set -o pipefail
          make template PACKAGE=${{ matrix.package }} \
            | bin/kubeconform \
                -strict \
                -summary \
                -ignore-missing-schemas \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  # Renders the chart and confirms every image it references actually exists in its registry.
  # Complements kubeconform: that job proves the rendered YAML is a valid Kubernetes object,
  # this proves the image it points at is real. Neither catches what the other does -- an upstream
  # release can cut a chart tag without publishing that release's images (confirmed directly
  # against packages/onlineboutique: GoogleCloudPlatform/microservices-demo's v0.10.6 tag exists,
  # but every one of that release's images 404s on its registry; v0.10.5's do not), and the
  # rendered manifest is still perfectly well-formed YAML either way. See
  # scripts/check-image-availability.sh for the full reasoning, including how it tells "this
  # image genuinely doesn't exist" apart from "the registry rate-limited an anonymous pull".
  image-availability:
    name: image availability (${{ matrix.package }})
    needs: detect-packages
    if: needs.detect-packages.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-packages.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve pinned helm version
        run: |
          source scripts/version
          echo "HELM_VERSION=${HELM_VERSION}" >> "$GITHUB_ENV"

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: make prepare
        run: make prepare PACKAGE=${{ matrix.package }}

      - name: Install crane
        run: ./scripts/pull-crane.sh

      - name: make check-images
        run: make check-images PACKAGE=${{ matrix.package }}

  # Runs each package's helm-unittest suite (packages/<name>/charts/tests/*_test.yaml), when it
  # has one -- most packages are forked upstream charts with no tests/ dir, so the "helm unittest"
  # step is skipped (not failed) for those. Complements kubeconform: kubeconform checks the
  # *rendered* manifests are valid Kubernetes/CRD objects, helm-unittest checks the *templating
  # logic itself* behaves as intended for a given input (e.g. that a flag actually turns a
  # resource on/off, or that a value ends up in the field it's supposed to).
  helm-unittest:
    name: helm unittest (${{ matrix.package }})
    needs: detect-packages
    if: needs.detect-packages.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-packages.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve pinned tool versions
        run: |
          source scripts/version
          echo "HELM_VERSION=${HELM_VERSION}" >> "$GITHUB_ENV"
          echo "HELM_UNITTEST_VERSION=${HELM_UNITTEST_VERSION}" >> "$GITHUB_ENV"

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: make prepare
        run: make prepare PACKAGE=${{ matrix.package }}

      - name: Check for a tests/ dir
        id: check
        run: |
          chart="$(./scripts/chart-dir.sh ${{ matrix.package }})"
          if [[ -d "${chart}/tests" ]]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install helm-unittest
        if: steps.check.outputs.has_tests == 'true'
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version "${HELM_UNITTEST_VERSION}" --verify=false

      - name: make unittest
        if: steps.check.outputs.has_tests == 'true'
        run: make unittest PACKAGE=${{ matrix.package }}

  # Runs each package's `kyverno test` suite (packages/<name>/charts/kyverno-test/kyverno-test.yaml),
  # when it has one -- most packages have no kyverno-test/ dir, so this is skipped (not failed) for
  # those. Complements helm-unittest/kubeconform: neither of those knows what a Kyverno CEL
  # expression actually evaluates to. This does -- it renders the chart and feeds the result to the
  # kyverno CLI against resource fixtures with known-good/known-bad expected results. See
  # https://kyverno.io/docs/guides/testing-policies/
  kyverno-test:
    name: kyverno test (${{ matrix.package }})
    needs: detect-packages
    if: needs.detect-packages.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-packages.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve pinned helm version
        run: |
          source scripts/version
          echo "HELM_VERSION=${HELM_VERSION}" >> "$GITHUB_ENV"

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: make prepare
        run: make prepare PACKAGE=${{ matrix.package }}

      - name: Check for a kyverno-test/ dir
        id: check
        run: |
          chart="$(./scripts/chart-dir.sh ${{ matrix.package }})"
          if [[ -d "${chart}/kyverno-test" ]]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install kyverno CLI
        if: steps.check.outputs.has_tests == 'true'
        run: ./scripts/pull-kyverno.sh

      - name: make kyverno-test
        if: steps.check.outputs.has_tests == 'true'
        run: make kyverno-test PACKAGE=${{ matrix.package }}

  # kyverno-test (above) proves each policies chart's OWN CEL rule logic is correct against
  # curated fixtures. This runs the opposite direction: renders EVERY changed package's chart and
  # asserts the result against the kyverno-pod-policies + kyverno-cluster-policies rulesets
  # layered together, to catch real violations (Pod Security Standards, plus org-governance/
  # cluster-security controls -- image tags, DNS hygiene, RBAC escalation, ...) in any chart before
  # it merges. Enforcement mirrors each ruleset's own shipped posture -- Enforce-tier violations
  # fail this job, Audit-tier violations are reported but never fail it. Skips
  # kyverno-pod-policies, kyverno-cluster-policies, and network-policies themselves (none render
  # workload-shaped resources for either ruleset to evaluate). No allow-list -- every changed
  # package is held to the same bar, unconditionally. See scripts/kyverno-policy-check.sh for the
  # full mechanics.
  #
  # Known gap: only re-checks packages a PR actually touches (see detect-packages) -- a change to
  # either policies chart's own rules that newly fails an untouched package elsewhere won't be
  # caught until that package's own next PR.
  kyverno-policy-check:
    name: kyverno policy check (${{ matrix.package }})
    needs: detect-packages
    if: needs.detect-packages.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-packages.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve pinned helm version
        run: |
          source scripts/version
          echo "HELM_VERSION=${HELM_VERSION}" >> "$GITHUB_ENV"

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: make prepare
        run: make prepare PACKAGE=${{ matrix.package }}

      - name: Install kyverno CLI
        run: ./scripts/pull-kyverno.sh

      - name: make kyverno-policy-check
        run: make kyverno-policy-check PACKAGE=${{ matrix.package }}

  # Single stable job to set as a required status check — the matrix jobs
  # above have per-package names (e.g. "helm lint (external-dns)") that
  # change with whatever a PR happens to touch, which branch protection
  # can't target directly. `if: always()` so this still runs (and fails)
  # when an upstream job fails or is cancelled, not just on success.
  summary:
    name: Summary
    if: always()
    needs: [detect-packages, package-version-bump, helm-lint, kubeconform, image-availability, helm-unittest, kyverno-test, kyverno-policy-check]
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix results
        run: |
          echo "detect-packages:      ${{ needs.detect-packages.result }}"
          echo "package-version-bump: ${{ needs.package-version-bump.result }}"
          echo "helm-lint:            ${{ needs.helm-lint.result }}"
          echo "kubeconform:          ${{ needs.kubeconform.result }}"
          echo "image-availability:   ${{ needs.image-availability.result }}"
          echo "helm-unittest:        ${{ needs.helm-unittest.result }}"
          echo "kyverno-test:         ${{ needs.kyverno-test.result }}"
          echo "kyverno-policy-check: ${{ needs.kyverno-policy-check.result }}"

          failed=0

          if [[ "${{ needs.detect-packages.result }}" != "success" ]]; then
            echo "::error::detect-packages did not succeed"
            failed=1
          fi

          for result in "${{ needs.package-version-bump.result }}" "${{ needs.helm-lint.result }}" "${{ needs.kubeconform.result }}" "${{ needs.image-availability.result }}" "${{ needs.helm-unittest.result }}" "${{ needs.kyverno-test.result }}" "${{ needs.kyverno-policy-check.result }}"; do
            if [[ "${result}" != "success" && "${result}" != "skipped" ]]; then
              echo "::error::a validation job did not succeed (result: ${result})"
              failed=1
            fi
          done

          if [[ "${failed}" -eq 1 ]]; then
            exit 1
          fi
          echo "All checks passed (a matrix job's per-package steps report success even when skipped internally, e.g. no packages changed or a package has no tests/ dir)."
